<html lang="en">
<head>

<title>Fat Bear Week Pool</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --spruce-900:#12363E;
  --spruce-700:#1E4E58;
  --spruce-600:#2A6474;
  --parchment:#FBF1DE;
  --parchment-dim:#F0E1BE;
  --amber:#E8792D;
  --amber-dark:#B85A1D;
  --rust:#C63A2E;
  --moss:#4C8C56;
  --gold:#F0B429;
  --gold-dark:#7A5300;
  --gold-bg:#FCEFC7;
  --ink:#1E2320;
  --ink-soft:#4B5049;
  --cream:#FBEFD9;
  --line:rgba(30,35,32,0.14);
  --line-dark:rgba(251,239,217,0.16);
  --radius:8px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--parchment);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  color:inherit;
  margin:0;
}
a{color:var(--amber-dark);}
button{font-family:inherit;}

/* NAV */
.nav{
  background:var(--spruce-900);
  color:var(--cream);
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.nav-brand{
  display:flex;
  align-items:baseline;
  gap:10px;
  padding:16px 0;
}
.nav-brand .mark{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:20px;
  color:var(--gold);
}
.nav-brand .year{
  font-size:13px;
  color:rgba(251,239,217,0.6);
}
.nav-tabs{
  display:flex;
  gap:4px;
}
.nav-tab{
  background:none;
  border:none;
  color:rgba(251,239,217,0.65);
  padding:16px 14px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s ease, border-color .15s ease;
}
.nav-tab:hover{color:var(--cream);}
.nav-tab.active{color:var(--cream);border-bottom-color:var(--gold);}

/* LAYOUT */
.page{
  max-width:1440px;
  margin:0 auto;
  padding:40px 24px 80px;
}
.page-narrow{max-width:900px;}

.hero{
  background:var(--spruce-900);
  color:var(--cream);
  padding:56px 24px 64px;
}
.hero-inner{
  max-width:1080px;
  margin:0 auto;
}
.hero h1{
  font-size:44px;
  line-height:1.08;
  letter-spacing:-0.01em;
  max-width:620px;
}
.hero p{
  color:rgba(244,239,226,0.75);
  font-size:16px;
  max-width:540px;
  margin-top:16px;
}
.hero a.explore-link{
  color:var(--amber);
  text-decoration:none;
  border-bottom:1px solid rgba(217,138,43,0.4);
}
.hero a.explore-link:hover{border-bottom-color:var(--amber);}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
}

.section-title{
  font-size:22px;
  margin-bottom:6px;
}
.section-sub{
  color:var(--ink-soft);
  font-size:14px;
  margin-bottom:24px;
}

/* FORM ELEMENTS */
label{
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--ink-soft);
  margin-bottom:6px;
}
input[type=text],input[type=password],input[type=datetime-local],select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:6px;
  font-size:15px;
  font-family:inherit;
  background:#fff;
  color:var(--ink);
}
input:focus,select:focus{
  outline:2px solid var(--amber);
  outline-offset:1px;
  border-color:var(--amber);
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:6px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:background .12s ease, transform .05s ease;
}
.btn:hover{background:var(--parchment-dim);}
.btn:active{transform:scale(0.98);}
.btn-primary{
  background:var(--amber);
  border-color:var(--amber);
  color:#3A2306;
}
.btn-primary:hover{background:var(--amber-dark);border-color:var(--amber-dark);color:var(--cream);}
.btn-ghost{
  background:transparent;
  border-color:transparent;
  color:var(--ink-soft);
}
.btn-ghost:hover{background:var(--parchment-dim);}
.btn-danger{color:var(--rust);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.field-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;}
.field-row > div{flex:1;min-width:180px;}

.banner{
  border-radius:var(--radius);
  padding:16px 20px;
  font-size:14px;
  margin-bottom:24px;
}
.banner-amber{background:#FCE7D2;border:1px solid #F0B67D;color:#7A3D0A;}
.banner-moss{background:#E3EFDE;border:1px solid #ABCCAA;color:#2C4D30;}
.banner-rust{background:#F7E0DC;border:1px solid #E7AFA5;color:#7A231A;}

/* BRACKET */
.bracket-scroll{
  overflow-x:auto;
  padding-bottom:12px;
  margin:0 -4px;
}
.bracket{
  display:flex;
  gap:18px;
  padding:4px;
  min-width:min-content;
  width:100%;
  justify-content:center;
}
.bracket-col{
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  min-width:188px;
}
.bracket-col-label{
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  margin-bottom:10px;
  text-align:center;
}
.match{
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#fff;
  margin:10px 0;
  width:188px;
}
.bear-card{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  padding:8px 10px;
  border:none;
  background:#fff;
  font-family:inherit;
  cursor:pointer;
  border-bottom:1px solid var(--line);
  transition:background .12s ease, opacity .12s ease, filter .12s ease;
}
.bear-card:last-child{border-bottom:none;}
.bear-card:hover{background:var(--parchment-dim);}
.bear-card-photo{
  width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--parchment-dim);
}
.bear-card-photo.placeholder{
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-size:15px;color:var(--ink-soft);
}
.bear-card-name{font-size:14px;color:var(--ink);line-height:1.25;}
.bear-card.selected{background:var(--moss);}
.bear-card.selected .bear-card-name{color:#fff;font-weight:500;}
.bear-card.dimmed{filter:grayscale(1);opacity:.4;}
.bear-card.dimmed:hover{opacity:.7;}
.bear-card.tbd{color:var(--ink-soft);font-style:italic;cursor:default;}
.bear-card.tbd:hover{background:#fff;}
.bear-card.tbd .bear-card-name{color:var(--ink-soft);font-style:italic;}
.bear-card.wrong{filter:grayscale(0.7);opacity:.5;}
.bear-card.wrong .bear-card-name{text-decoration:line-through;}
.bear-card.correct{background:var(--moss);}
.bear-card.correct .bear-card-name{color:#fff;font-weight:500;}
.bear-card.correct::after{content:" \2713";color:#fff;margin-left:auto;font-weight:700;}
.bye-card{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px dashed var(--line);
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
  color:var(--ink-soft);
  margin:10px 0;
  background:var(--parchment-dim);
  width:188px;
}
.bye-card .bear-card-photo{width:34px;height:34px;}
.champion-card{
  border:2px solid var(--gold);
  border-radius:8px;
  padding:16px;
  text-align:center;
  background:var(--gold-bg);
  margin:10px 0;
  width:188px;
}
.champion-card .champ-photo{
  width:76px;height:76px;border-radius:8px;object-fit:cover;margin:0 auto 10px;display:block;background:#fff;
}
.champion-card .champ-photo.placeholder{
  display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:22px;color:var(--gold-dark);
}
.champion-card .label{font-size:11px;color:var(--gold-dark);font-weight:600;margin-bottom:4px;}
.champion-card .name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}

/* LEADERBOARD */
table.leaderboard{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
table.leaderboard th{
  text-align:left;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  padding:10px 12px;
  border-bottom:2px solid var(--line);
}
table.leaderboard td{
  padding:12px;
  border-bottom:1px solid var(--line);
}
table.leaderboard tr:last-child td{border-bottom:none;}
.rank-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;

.rank-badge.top{background:var(--gold);color:var(--gold-dark);}
.you-row{background:#FBEDD7;}

.countdown{

  margin:20px 0;
}
.countdown-unit{text-align:center;}
.countdown-num{
  font-family:'Fraunces',serif;
  font-size:34px;
  font-weight:600;
  color:var(--spruce-900);
}
.countdown-label{font-size:11px;color:var(--ink-soft);}

/* ADMIN */
.admin-bear-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}
.admin-bear-row input[type=text]{flex:1;min-width:140px;}
.admin-bear-row label{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;white-space:nowrap;}
.admin-bear-row .idx{
  width:24px;
  font-size:12px;
  color:var(--ink-soft);
  text-align:right;
}
.bear-photo-thumb{
  width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--parchment-dim);
}
.bear-photo-thumb-placeholder{
  width:40px;height:40px;border-radius:6px;flex-shrink:0;background:var(--parchment-dim);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;
}
.bear-photo-input{
  font-size:12px;
  max-width:150px;
}
.icon-btn{
  background:none;border:1px solid var(--line);border-radius:5px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-soft);font-size:15px;flex-shrink:0;
}
.icon-btn:hover{background:var(--parchment-dim);}

@media (max-width:640px){
  .hero h1{font-size:32px;}
  .page{padding:24px 16px 60px;}
  .nav{padding:0 16px;}
}

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){

/* ---------- Firebase setup ----------
Paste your own project's config below (Firebase console > Project settings >
General > Your apps > SDK setup and configuration > Config). These values are
meant to be public in client code — Firestore security rules control access,
not this config.
------------------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAXJ-pdvu5mMAqsPOSipOK1yxsBWBv_6Ng",
  authDomain: "fat-bear-week-pool.firebaseapp.com",
  projectId: "fat-bear-week-pool",
  storageBucket: "fat-bear-week-pool.firebasestorage.app",
  messagingSenderId: "679222502738",
  appId: "1:679222502738:web:725f158f1c6e9c743c068b"
};
const FIREBASE_NOT_CONFIGURED = firebaseConfig.apiKey === 'YOUR_API_KEY';
let db = null;
if(!FIREBASE_NOT_CONFIGURED){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

/* ---------- storage helpers ----------
Thin key-value adapter over a single Firestore collection ("kv"), so all the
app logic below (config/results/submissions/admin passcode) is unchanged from
before — it just reads and writes string values under string keys. The
"shared" parameter is kept for API compatibility but ignored: every key here
is shared across everyone who opens the page, since there's no per-user login.
------------------------------------------------------------------------- */
async function sget(key, shared){
  if(!db) return null;
  try{
    const snap = await db.collection('kv').doc(key).get();
    if(!snap.exists) return null;
    return snap.data().value;
  }catch(e){ console.error('Fat Bear Week: sget failed', key, e); return null; }
}
async function sset(key, value, shared){
  if(!db) return false;
  try{
    await db.collection('kv').doc(key).set({value});
    return true;
  }catch(e){ console.error('Fat Bear Week: sset failed', key, e); return false; }
}
async function slist(prefix, shared){
  if(!db) return [];
  try{
    const snap = await db.collection('kv')
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff')
      .get();
    return snap.docs.map(d=>d.id);
  }catch(e){ console.error('Fat Bear Week: slist failed', prefix, e); return []; }
}
async function sdelete(key, shared){
  if(!db) return false;
  try{
    await db.collection('kv').doc(key).delete();
    return true;
  }catch(e){ console.error('Fat Bear Week: sdelete failed', key, e); return false; }
}
function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

/* ---------- bracket engine ----------
config.bears: [{name, bye}] in slot order
Returns an array of rounds. Round 0 is special: entries are
  {type:'match', matchId, a, b} or {type:'bye', bear}
Later rounds: [{matchId, a, b}]  (a/b resolved from picks, or null if TBD)
------------------------------------- */
function buildRound1Entries(bears){
  const entries = [];
  let pending = null;
  let matchIdx = 0;
  bears.forEach(b=>{
    if(!b.name) return;
    if(b.bye){
      entries.push({type:'bye', bear:b.name});
    } else if(pending===null){
      pending = b.name;
    } else {
      entries.push({type:'match', matchId:'r1m'+matchIdx, a:pending, b:b.name});
      matchIdx++;
      pending = null;
    }
  });
  return entries;
}

function buildRounds(bears, picks){
  picks = picks || {};
  const round1Entries = buildRound1Entries(bears);
  const rounds = [round1Entries];
  let advancers = round1Entries.map(e=>{
    if(e.type==='bye') return e.bear;
    return picks[e.matchId] || null;
  });
  let roundNum = 2;
  while(advancers.length > 1){
    const matches = [];
    for(let i=0;i<advancers.length;i+=2){
      matches.push({
        matchId:'r'+roundNum+'m'+(i/2),
        a: advancers[i] || null,
        b: advancers[i+1] || null
      });
    }
    rounds.push(matches);
    advancers = matches.map(m=> picks[m.matchId] || null);
    roundNum++;
  }
  return rounds; // last round has exactly one match -> champion is picks[thatMatchId]
}

function allMatchIds(bears){
  const rounds = buildRounds(bears, {});
  const ids = [];
  rounds.forEach((round,i)=>{
    round.forEach(entry=>{
      if(i===0){ if(entry.type==='match') ids.push(entry.matchId); }
      else ids.push(entry.matchId);
    });
  });
  return ids;
}

/* prune picks that no longer correspond to a valid a/b pair after an upstream change */
function prunePicks(bears, picks){
  let changed = true;
  let p = Object.assign({}, picks);
  while(changed){
    changed = false;
    const rounds = buildRounds(bears, p);
    rounds.forEach((round,i)=>{
      round.forEach(entry=>{
        if(i===0 && entry.type!=='match') return;
        const mid = entry.matchId;
        if(p[mid] && entry.a!==undefined){
          if(p[mid] !== entry.a && p[mid] !== entry.b){
            delete p[mid];
            changed = true;
          }
        }
      });
    });
  }
  return p;
}

/* ---------- scoring ---------- */
function scoreSubmission(bears, submissionPicks, resultPicks){
  const ids = allMatchIds(bears);
  let correct=0, decided=0;
  ids.forEach(id=>{
    if(resultPicks[id]){
      decided++;
      if(submissionPicks[id] && submissionPicks[id]===resultPicks[id]) correct++;
    }
  });
  return {correct, decided, total: ids.length};
}

/* ---------- state ---------- */
const state = {
  view:'home',
  activeYear:null,
  config:null, // config for activeYear
  userName:'',
  userPicks:{},
  userSubmittedAt:null,
  adminAuthed:false,
  adminYear:null, // year being edited in admin
  adminConfig:null,
  adminResults:null,
  adminEditingSlug:null,
  adminEditingName:null,
  adminEditingPicks:null,
  storageOk:true,
  adminSampleMessage:null
};

const DEFAULT_VOTING_START = '2026-09-22T16:00:00.000Z'; // Tue Sep 22 2026, 12:00 PM EDT

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
}

/* ---------- data loading ---------- */
async function loadActiveYear(){
  const v = await sget('active-year', true);
  return v ? JSON.parse(v).year : String(new Date().getFullYear());
}
async function loadConfig(year){
  const v = await sget('config:'+year, true);
  return v ? JSON.parse(v) : null;
}
async function saveConfig(year, cfg){
  await sset('config:'+year, JSON.stringify(cfg), true);
}
async function loadResults(year){
  const v = await sget('results:'+year, true);
  return v ? JSON.parse(v) : {picks:{}};
}
async function saveResults(year, res){
  await sset('results:'+year, JSON.stringify(res), true);
}
async function loadSubmission(year, name){
  const slug = slugify(name);
  if(!slug) return null;
  const v = await sget('submission:'+year+':'+slug, true);
  return v ? JSON.parse(v) : null;
}
async function saveSubmission(year, name, picks){
  const slug = slugify(name);
  const existing = await loadSubmission(year, name);
  const record = {
    name: name.trim(),
    picks,
    submittedAt: existing ? existing.submittedAt : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  await sset('submission:'+year+':'+slug, JSON.stringify(record), true);
  return record;
}
async function loadAllSubmissions(year){
  const keys = await slist('submission:'+year+':', true);
  const out = [];
  for(const k of keys){
    const v = await sget(k, true);
    if(v) out.push(JSON.parse(v));
  }
  return out;
}
async function getAdminPasscode(){
  return await sget('admin-passcode', true);
}
async function setAdminPasscode(pw){
  await sset('admin-passcode', pw, true);
}

/* ---------- rendering: bracket editor (shared by home + admin) ----------
options: {readonly, showResults(result picks to overlay correctness)}
onPick(matchId, bearName)
------------------------------------------------------------------- */
function bearPhotoEl(bear, sizeClass){
  if(bear && bear.image){
    const img = document.createElement('img');
    img.className = sizeClass;
    img.src = bear.image;
    img.alt = '';
    return img;
  }
  const div = document.createElement('div');
  div.className = sizeClass + ' placeholder';
  const initial = bear && bear.name ? bear.name.trim().charAt(0).toUpperCase() : '?';
  div.textContent = initial;
  return div;
}

function isPow2(n){ return n>0 && (n & (n-1))===0; }

function numRoundsPerSide(bears){
  const entries = buildRound1Entries((bears||[]).filter(b=>b.name && b.name.trim()));
  const advancerCount = entries.length;
  if(!isPow2(advancerCount) || advancerCount<2) return 0;
  return Math.log2(advancerCount);
}

function defaultRoundLabels(n){
  const left=[], right=[];
  for(let i=0;i<n;i++){
    const label = (i===n-1 && n>1) ? 'Semifinal' : 'Round '+(i+1);
    left.push(label);
    right.push(label);
  }
  return {left, right, final:'Final'};
}

function getRoundLabels(bears, configLabels){
  const n = numRoundsPerSide(bears);
  const base = defaultRoundLabels(n);
  if(!configLabels) return base;
  return {
    left: base.left.map((d,i)=> (configLabels.left && configLabels.left[i]) || d),
    right: base.right.map((d,i)=> (configLabels.right && configLabels.right[i]) || d),
    final: configLabels.final || base.final
  };
}

/* builds one bracket-col DOM node for a list of round-1 entries (match/bye) or later-round match objects */
function buildColumn(labelText, roundEntries, ri, byName, picks, opts, onPick){
  const col = document.createElement('div');
  col.className = 'bracket-col';
  const label = document.createElement('div');
  label.className = 'bracket-col-label';
  label.textContent = labelText;
  col.appendChild(label);

  roundEntries.forEach(entry=>{
    if(ri===0 && entry.type==='bye'){
      const bye = document.createElement('div');
      bye.className = 'bye-card';
      bye.appendChild(bearPhotoEl(byName[entry.bear], 'bear-card-photo'));
      const txt = document.createElement('span');
      txt.textContent = entry.bear + ' — bye, advances automatically';
      bye.appendChild(txt);
      col.appendChild(bye);
      return;
    }
    col.appendChild(buildMatchCell(entry, ri, byName, picks, opts, onPick));
  });

  return col;
}

function buildMatchCell(entry, ri, byName, picks, opts, onPick){
  const matchId = entry.matchId;
  const a = entry.a, b = entry.b;
  const m = document.createElement('div');
  m.className = 'match';
  if(!a && !b){
    const row = document.createElement('div');
    row.className = 'bear-card tbd';
    const ph = document.createElement('div');
    ph.className = 'bear-card-photo placeholder';
    ph.textContent = '?';
    row.appendChild(ph);
    const nameEl = document.createElement('span');
    nameEl.className = 'bear-card-name';
    nameEl.textContent = 'To be determined';
    row.appendChild(nameEl);
    m.appendChild(row);
    return m;
  }
  const hasPick = !!picks[matchId];
  [a,b].forEach(name=>{
    const el = document.createElement(opts.readonly ? 'div' : 'button');
    let cls = 'bear-card';
    if(!name){
      cls += ' tbd';
      const ph = document.createElement('div');
      ph.className = 'bear-card-photo placeholder';
      ph.textContent = '?';
      el.appendChild(ph);
      const nameEl = document.createElement('span');
      nameEl.className = 'bear-card-name';
      nameEl.textContent = 'To be determined';
      el.appendChild(nameEl);
    } else {
      const isSelected = picks[matchId]===name;
      if(isSelected) cls += ' selected';
      else if(hasPick) cls += ' dimmed';
      if(opts.resultPicks){
        const officialWinner = opts.resultPicks[matchId];
        if(officialWinner){
          if(officialWinner===name && picks[matchId]===name) cls += ' correct';
          else if(officialWinner!==name && picks[matchId]===name) cls += ' wrong';
        }
      }
      el.appendChild(bearPhotoEl(byName[name], 'bear-card-photo'));
      const nameEl = document.createElement('span');
      nameEl.className = 'bear-card-name';
      nameEl.textContent = name;
      el.appendChild(nameEl);
    }
    el.className = cls;
    if(!opts.readonly && name){
      el.onclick = ()=> onPick(matchId, name);
    }
    m.appendChild(el);
  });
  return m;
}

function buildFinalColumn(labelText, finalEntry, byName, picks, opts, onPick){
  const col = document.createElement('div');
  col.className = 'bracket-col';
  const label = document.createElement('div');
  label.className = 'bracket-col-label';
  label.textContent = labelText;
  col.appendChild(label);

  const a = finalEntry.a, b = finalEntry.b, matchId = finalEntry.matchId;
  const champ = document.createElement('div');
  champ.className = 'champion-card';
  const pick = picks[matchId];
  if(!a || !b){
    champ.innerHTML = '<div class="label">Champion</div><div class="champ-photo placeholder">?</div><div class="name" style="color:var(--ink-soft);font-style:italic;">To be determined</div>';
  } else if(pick){
    champ.innerHTML = '<div class="label">Champion</div>';
    champ.appendChild(bearPhotoEl(byName[pick], 'champ-photo'));
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = pick;
    champ.appendChild(nameEl);
  } else {
    champ.innerHTML = '<div class="label">Champion</div><div class="champ-photo placeholder">?</div><div class="name" style="color:var(--ink-soft);">Pick one below</div>';
  }
  col.appendChild(champ);
  if(a && b && !opts.readonly){
    col.appendChild(buildMatchCell(finalEntry, -1, byName, picks, opts, onPick));
  }
  return col;
}

/* Redraws a bracket container while preserving its horizontal scroll position,
   since a full rebuild on every pick would otherwise snap back to the left. */
function redrawBracketPreservingScroll(container, drawFn){
  const existingScroller = container.querySelector('.bracket-scroll');
  const scrollLeft = existingScroller ? existingScroller.scrollLeft : 0;
  drawFn();
  const newScroller = container.querySelector('.bracket-scroll');
  if(newScroller) newScroller.scrollLeft = scrollLeft;
}

function renderBracketTree(container, bears, picks, opts, onPick){
  opts = opts || {};
  const byName = {};
  (bears||[]).forEach(b=>{ if(b.name) byName[b.name] = b; });
  const rounds = buildRounds(bears, picks);
  const wrap = document.createElement('div');
  wrap.className = 'bracket-scroll';
  const bracket = document.createElement('div');
  bracket.className = 'bracket';

  const advancerCount = rounds[0].length;
  const finalIdx = rounds.length-1;

  if(isPow2(advancerCount) && advancerCount>=2){
    const labels = getRoundLabels(bears, opts.roundLabels);
    const n = finalIdx; // rounds per side, excludes final round itself

    for(let r=0; r<n; r++){
      const full = rounds[r];
      const half = full.length/2;
      const leftEntries = full.slice(0, half);
      bracket.appendChild(buildColumn(labels.left[r] || ('Round '+(r+1)), leftEntries, r, byName, picks, opts, onPick));
    }

    bracket.appendChild(buildFinalColumn(labels.final || 'Final', rounds[finalIdx][0], byName, picks, opts, onPick));

    for(let r=n-1; r>=0; r--){
      const full = rounds[r];
      const half = full.length/2;
      const rightEntries = full.slice(half);
      bracket.appendChild(buildColumn(labels.right[r] || ('Round '+(r+1)), rightEntries, r, byName, picks, opts, onPick));
    }
  } else {
    // fallback: simple left-to-right linear layout (used only while the bracket setup is invalid)
    rounds.forEach((round, ri)=>{
      const labelText = (ri===0) ? 'Round 1' : (ri===finalIdx ? 'Champion' : 'Round '+(ri+1));
      if(ri===finalIdx){
        bracket.appendChild(buildFinalColumn(labelText, round[0], byName, picks, opts, onPick));
      } else {
        bracket.appendChild(buildColumn(labelText, round, ri, byName, picks, opts, onPick));
      }
    });
  }

  wrap.appendChild(bracket);
  container.appendChild(wrap);
}

async function renderLeaderboard(){
  app.innerHTML = '';
  const page = document.createElement('div');
  page.className = 'page';
  app.appendChild(page);

  const cfg = state.config;
  if(!cfg || !cfg.bears || cfg.bears.filter(b=>b.name).length < 2){
    page.innerHTML = `<div class="card"><h2 class="section-title">Leaderboard</h2>
      <p class="section-sub" style="margin-bottom:0;">The bracket for ${state.activeYear} hasn't been set up yet.</p></div>`;
    return;
  }

  const now = new Date();
  const votingStart = new Date(cfg.votingStartISO || DEFAULT_VOTING_START);

  if(now < votingStart){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2 class="section-title">Leaderboard opens soon</h2>
      <p class="section-sub">Standings unlock once voting starts, so nobody gets an early peek.</p>
      <div class="countdown" id="countdown"></div>
      <p style="font-size:13px;color:var(--ink-soft);">Unlocks ${fmtDate(cfg.votingStartISO || DEFAULT_VOTING_START)}.</p>`;
    page.appendChild(card);
    const cdEl = card.querySelector('#countdown');
    function tick(){
      const diff = votingStart - new Date();
      if(diff<=0){ renderLeaderboard(); return; }
      const d = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      cdEl.innerHTML = [['Days',d],['Hrs',h],['Min',m],['Sec',s]].map(([label,val])=>
        `<div class="countdown-unit"><div class="countdown-num">${val}</div><div class="countdown-label">${label}</div></div>`
      ).join('');
    }
    tick();
    state._countdownInterval && clearInterval(state._countdownInterval);
    state._countdownInterval = setInterval(tick, 1000);
    return;
  }

  const results = await loadResults(state.activeYear);
  const submissions = await loadAllSubmissions(state.activeYear);

  const scored = submissions.map(s=>{
    const sc = scoreSubmission(cfg.bears, s.picks || {}, results.picks || {});
    return Object.assign({}, s, sc);
  });
  scored.sort((a,b)=> b.correct - a.correct);

  const card = document.createElement('div');
  card.className = 'card';
  let rowsHtml = '';
  if(scored.length===0){
    rowsHtml = `<tr><td colspan="4" style="color:var(--ink-soft);">No brackets submitted yet.</td></tr>`;
  } else {
    let rank = 0, lastScore = null, shown = 0;
    scored.forEach((s)=>{
      shown++;
      if(s.correct !== lastScore){ rank = shown; lastScore = s.correct; }
      const isTop = rank===1 && s.correct>0;
      const isYou = state.userName && slugify(state.userName)===slugify(s.name);
      rowsHtml += `<tr class="${isYou?'you-row':''}">
        <td><span class="rank-badge${isTop?' top':''}">${rank}</span></td>
        <td>${escapeHtml(s.name)}${isYou?' <span style="color:var(--amber-dark);font-size:12px;">(you)</span>':''}</td>
        <td>${s.correct} / ${s.decided}</td>
        <td>${s.decided ? Math.round(s.correct/s.decided*100)+'%' : '—'}</td>
      </tr>`;
    });
  }
  card.innerHTML = `
    <h2 class="section-title">Standings</h2>
    <p class="section-sub">Ranked by correct picks against the official bracket so far.</p>
    <table class="leaderboard">
      <thead><tr><th>Rank</th><th>Name</th><th>Correct</th><th>Accuracy</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;
  page.appendChild(card);

  if(results.picks && Object.keys(results.picks).length>0){
    const officialCard = document.createElement('div');
    officialCard.className = 'card';
    officialCard.style.marginTop = '24px';
    officialCard.innerHTML = `<h2 class="section-title">Official bracket so far</h2><p class="section-sub">Results as entered by the pool organizer.</p>`;
    const mount = document.createElement('div');
    officialCard.appendChild(mount);
    renderBracketTree(mount, cfg.bears, results.picks, {readonly:true, roundLabels: cfg.roundLabels}, ()=>{});
    page.appendChild(officialCard);
  }
}

  function updateWarning(){
    const warnEl = cfgCard.querySelector('#config-warning');

    if(bears.length < 2){
      warnEl.innerHTML = '';
      return;
    }
    const entries = buildRound1Entries(bears);
    const advancerCount = entries.length;
    const isPow2 = advancerCount>0 && (advancerCount & (advancerCount-1))===0;
    let html = '';
    if(!isPow2){
      html += `<div class="banner banner-rust" style="margin:0 0 10px;">After round 1, ${advancerCount} bears advance. That's not a clean power of two (4, 8, 16…), so later rounds won't pair evenly. Adjust byes or add/remove a bear.</div>`;
    } else {
      const totalMatches = allMatchIds(bears).length;
      html += `<div class="banner banner-moss" style="margin:0 0 10px;">Looks good — ${bears.length} bears, ${advancerCount} advance past round 1, ${totalMatches} total matches to pick.</div>`;
    }
    const approxBytes = JSON.stringify(state.adminConfig).length;
    if(approxBytes > 700000){
      html += `<div class="banner banner-rust" style="margin:0;">This year's setup is getting large (~${Math.round(approxBytes/1024*10)/10}KB) with all the photos included — the database can't store a single item over 1MB. Use smaller or fewer photos, or lower-resolution originals.</div>`;

async function drawSubmissionsSection(container, validBears){
  const subs = await loadAllSubmissions(state.adminYear);
  container.innerHTML = '';

  title.className = 'section-title';
  title.textContent = 'Submissions ('+subs.length+')';
  container.appendChild(title);

  if(state.adminEditingSlug){
    const editingSub = subs.find(s=>slugify(s.name)===state.adminEditingSlug);
    if(editingSub && validBears.length>=2){
      const editPanel = document.createElement('div');
      editPanel.style.cssText = 'margin-bottom:20px;border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--parchment-dim);';
      editPanel.innerHTML = `<p class="section-sub" style="margin-bottom:12px;">Editing <strong>${escapeHtml(editingSub.name)}</strong>'s bracket.</p>`;
      const mount = document.createElement('div');
      editPanel.appendChild(mount);
      const btnRow = document.createElement('div');
      btnRow.style.marginTop='14px';
      btnRow.innerHTML = `<button class="btn btn-primary" id="save-edit-btn">Save changes</button> <button class="btn btn-ghost" id="cancel-edit-btn">Cancel</button> <span id="edit-status" style="font-size:13px;color:var(--ink-soft);margin-left:8px;"></span>`;
      editPanel.appendChild(btnRow);
      container.appendChild(editPanel);

      function drawEditBracket(){
        redrawBracketPreservingScroll(mount, ()=>{
          mount.innerHTML = '';
          renderBracketTree(mount, validBears, state.adminEditingPicks, {roundLabels: state.adminConfig.roundLabels}, (matchId, bearName)=>{
            state.adminEditingPicks[matchId] = bearName;
            state.adminEditingPicks = prunePicks(validBears, state.adminEditingPicks);
            drawEditBracket();
          });
        });
      }
      drawEditBracket();

      editPanel.querySelector('#save-edit-btn').onclick = async ()=>{
        const statusEl = editPanel.querySelector('#edit-status');
        statusEl.textContent = 'Saving…';
        editingSub.picks = state.adminEditingPicks;
        editingSub.updatedAt = new Date().toISOString();
        await sset('submission:'+state.adminYear+':'+state.adminEditingSlug, JSON.stringify(editingSub), true);
        state.adminEditingSlug = null; state.adminEditingName = null; state.adminEditingPicks = null;
        await drawSubmissionsSection(container, validBears);
      };
      editPanel.querySelector('#cancel-edit-btn').onclick = async ()=>{
        state.adminEditingSlug = null; state.adminEditingName = null; state.adminEditingPicks = null;
        await drawSubmissionsSection(container, validBears);
      };
    }
  }

  const table = document.createElement('table');
  table.className = 'leaderboard';
  if(subs.length===0){
    table.innerHTML = `<tbody><tr><td style="color:var(--ink-soft);">No submissions yet.</td></tr></tbody>`;
  } else {
    const canEdit = validBears.length>=2;
    const rowsHtml = subs.map(s=>{
      const slug = slugify(s.name);
      return `<tr>
        <td>${escapeHtml(s.name)}</td>
        <td>${fmtDate(s.updatedAt)}</td>
        <td style="white-space:nowrap;">
          ${canEdit ? `<button class="btn btn-ghost sub-edit" data-slug="${slug}" style="padding:6px 10px;">Edit</button>` : ''}
          <button class="btn btn-ghost sub-reset" data-slug="${slug}" style="padding:6px 10px;">Reset</button>
          <button class="btn btn-ghost sub-delete" data-slug="${slug}" style="padding:6px 10px;color:var(--rust);">Delete</button>
        </td>
      </tr>`;
    }).join('');
    table.innerHTML = `<thead><tr><th>Name</th><th>Last updated</th><th>Actions</th></tr></thead><tbody>${rowsHtml}</tbody>`;
  }
  container.appendChild(table);

  container.querySelectorAll('.sub-edit').forEach(btn=>{
    btn.onclick = async ()=>{
      const slug = btn.dataset.slug;
      const sub = subs.find(s=>slugify(s.name)===slug);
      if(!sub) return;
      state.adminEditingSlug = slug;
      state.adminEditingName = sub.name;
      state.adminEditingPicks = Object.assign({}, sub.picks||{});
      await drawSubmissionsSection(container, validBears);
    };
  });

  container.querySelectorAll('.sub-reset').forEach(btn=>{
    armDoubleClick(btn, 'Reset', 'Clear picks?', async ()=>{
      const slug = btn.dataset.slug;
      const sub = subs.find(s=>slugify(s.name)===slug);
      if(!sub) return;
      sub.picks = {};
      sub.updatedAt = new Date().toISOString();
      await sset('submission:'+state.adminYear+':'+slug, JSON.stringify(sub), true);
      await drawSubmissionsSection(container, validBears);
    });
  });

  container.querySelectorAll('.sub-delete').forEach(btn=>{
    armDoubleClick(btn, 'Delete', 'Confirm delete?', async ()=>{
      const slug = btn.dataset.slug;
      await sdelete('submission:'+state.adminYear+':'+slug, true);
      await drawSubmissionsSection(container, validBears);
    });
  });
}

function armDoubleClick(btn, restLabel, armedLabel, onConfirm){
  btn.textContent = restLabel;
  btn.onclick = ()=>{
    if(btn.dataset.armed==='1'){
      btn.dataset.armed = '';
      onConfirm();
    } else {
      btn.dataset.armed = '1';
      btn.textContent = armedLabel;
      setTimeout(()=>{
        if(btn.dataset.armed==='1'){
          btn.dataset.armed = '';
          btn.textContent = restLabel;
        }
      }, 3000);
    }
  };
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Could not load image'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

/* ---------- utils ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isoToLocalInput(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function localInputToIso(val){
  if(!val) return null;
  const d = new Date(val);
  if(isNaN(d.getTime())) return null;
  return d.toISOString();
}

async function switchView(view, opts){
  opts = opts || {};
  state.view = view;
  if(!opts.skipHash){
    const hashVal = view==='home' ? '' : view;
    history.replaceState(null, '', hashVal ? ('#'+hashVal) : window.location.pathname + window.location.search);
  }
  setNavYear();
  if(view==='home') await renderHome();
  else if(view==='leaderboard') await renderLeaderboard();
  else if(view==='admin') await renderAdmin();
}

document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.onclick = ()=> switchView(tab.dataset.view);
});

window.addEventListener('hashchange', ()=>{
  const v = window.location.hash.replace('#','') || 'home';
  if(VALID_VIEWS.includes(v)) switchView(v, {skipHash:true});
});

/* ---------- init ---------- */
async function checkStorageAvailable(){
  if(FIREBASE_NOT_CONFIGURED || !db){
    return {ok:false, reason:'unconfigured'};
  }
  try{
    await db.collection('kv').doc('connectivity-check').set({value:String(Date.now())});
    return {ok:true};
  }catch(e){
    console.error('Fat Bear Week: Firestore check failed', e);
    return {ok:false, reason:'unreachable'};
  }
}

async function init(){
  const check = await checkStorageAvailable();
  state.storageOk = check.ok;
  const warnEl = document.getElementById('storage-warning');
  if(warnEl){
    if(check.ok){
      warnEl.style.display = 'none';
    } else {
      warnEl.style.display = 'block';
      warnEl.textContent = check.reason==='unconfigured'
        ? "This page isn't connected to its database yet. See the comment near the top of the file's <script> for setup steps."
        : "Can't reach the database right now. Check your Firestore security rules and internet connection, then refresh.";
    }
  }
  state.activeYear = await loadActiveYear();
  state.config = await loadConfig(state.activeYear);
  setNavYear();
  const initialView = window.location.hash.replace('#','');
  const view = VALID_VIEWS.includes(initialView) ? initialView : 'home';
  await switchView(view, {skipHash:true});
}
init();

})();
</script>
</body>
</html>
