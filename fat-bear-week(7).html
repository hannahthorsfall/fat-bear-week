<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fat Bear Week Pool</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap');

:root{
  --spruce-900:#12363E;
  --spruce-700:#1E4E58;
  --spruce-600:#2A6474;
  --parchment:#FBF1DE;
  --parchment-dim:#F0E1BE;
  --amber:#E8792D;
  --amber-dark:#B85A1D;
  --rust:#C63A2E;
  --moss:#4C8C56;
  --gold:#F0B429;
  --gold-dark:#7A5300;
  --gold-bg:#FCEFC7;
  --ink:#1E2320;
  --ink-soft:#4B5049;
  --cream:#FBEFD9;
  --line:rgba(30,35,32,0.14);
  --line-dark:rgba(251,239,217,0.16);
  --radius:8px;
  --font-pixel:'Press Start 2P', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background-color:var(--parchment);
  background-image:linear-gradient(rgba(30,78,88,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(30,78,88,.045) 2px,transparent 2px);
  background-size:24px 24px;
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  color:inherit;
  margin:0;
}
a{color:var(--amber-dark);}
button{font-family:inherit;}

/* NAV */
.nav{
  background:#101919;
  color:var(--cream);
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  border-bottom:3px solid var(--gold);
  box-shadow:0 4px 0 var(--amber-dark);
}
.nav-brand{
  display:flex;
  align-items:baseline;
  gap:10px;
  padding:16px 0;
}
.nav-brand .mark{
  font-family:var(--font-pixel);
  font-size:13px;
  line-height:1.5;
  color:var(--gold);
}
.nav-brand .year{
  font-size:13px;
  color:rgba(251,239,217,0.6);
}
.nav-tabs{
  display:flex;
  gap:4px;
}
.nav-tab{
  background:none;
  border:none;
  color:rgba(251,239,217,0.65);
  padding:16px 14px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s ease, border-color .15s ease;
}
.nav-tab:hover{color:var(--cream);}
.nav-tab.active{color:var(--cream);border-bottom-color:var(--gold);}
.nav-tab.active::before{content:'\25B6';color:var(--gold);font-size:9px;margin-right:7px;}

/* LAYOUT */
.page{
  max-width:1440px;
  margin:0 auto;
  padding:40px 24px 80px;
}
.page-narrow{max-width:900px;}
.full-bleed{
  width:100vw;
  margin-left:calc(-50vw + 50%);
  margin-right:calc(-50vw + 50%);
  padding:0 20px;
  box-sizing:border-box;
}
@media (max-width:640px){
  .full-bleed{padding:0 16px;}
}

.hero{
  position:relative;
  overflow:hidden;
  background:var(--spruce-900);
  color:var(--cream);
  min-height:390px;
  padding:72px 24px 78px;
  border-top:4px solid var(--gold);
  border-bottom:4px solid var(--gold);
  display:flex;
  align-items:center;
}
.hero-art{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
}
.hero-art::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(18,54,62,.98) 0%,rgba(18,54,62,.9) 35%,rgba(18,54,62,.3) 68%,rgba(18,54,62,.08) 100%);
}
.hero-art svg,.hero-art img{display:block;width:100%;height:100%;}
.hero-art img{object-fit:cover;object-position:center center;}
.hero-inner{
  position:relative;
  z-index:1;
  max-width:1080px;
  width:100%;
  margin:0 auto;
}
.hero h1{
  font-family:var(--font-pixel);
  font-size:38px;
  line-height:1.35;
  letter-spacing:0;
  max-width:620px;
  text-shadow:3px 3px 0 rgba(10,34,40,.75);
}
.hero p{
  color:rgba(251,239,217,.88);
  font-size:16px;
  max-width:540px;
  margin-top:16px;
  text-shadow:1px 1px 0 rgba(10,34,40,.8);
}
.hero a.explore-link{
  color:var(--amber);
  text-decoration:none;
  border-bottom:1px solid rgba(217,138,43,0.4);
}
.hero a.explore-link:hover{border-bottom-color:var(--amber);}

@media (max-width:760px){
  .hero{min-height:440px;padding:52px 24px 190px;align-items:flex-start;}
  .hero-art::after{background:linear-gradient(180deg,rgba(18,54,62,.98) 0%,rgba(18,54,62,.88) 48%,rgba(18,54,62,.2) 78%,rgba(18,54,62,.05) 100%);}
  .hero-art img{object-position:72% center;}
  .hero h1{font-size:27px;line-height:1.45;}
  .hero p{font-size:15px;max-width:520px;}
}
@media (max-width:420px){
  .hero{padding-left:18px;padding-right:18px;}
  .hero h1{font-size:22px;}
}

.card{
  background:#fff;
  border:2px solid var(--spruce-900);
  border-radius:4px;
  padding:24px;
  box-shadow:6px 6px 0 rgba(18,54,62,.2);
}

.section-title{
  font-size:22px;
  margin-bottom:6px;
  color:var(--spruce-900);
}
.section-sub{
  color:var(--ink-soft);
  font-size:14px;
  margin-bottom:24px;
}

/* FORM ELEMENTS */
label{
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--ink-soft);
  margin-bottom:6px;
}
input[type=text],input[type=password],input[type=datetime-local],select{
  width:100%;
  padding:10px 12px;
  border:2px solid var(--spruce-900);
  border-radius:3px;
  font-size:15px;
  font-family:inherit;
  background:#fff;
  color:var(--ink);
}
input:focus,select:focus{
  outline:2px solid var(--amber);
  outline-offset:1px;
  border-color:var(--amber);
}
.pin-input{font-family:var(--font-pixel)!important;letter-spacing:.35em;text-align:center;}
.pin-help{font-size:12px;color:var(--ink-soft);margin:7px 0 0;max-width:420px;}
.credential-error{color:var(--rust);font-size:13px;margin-top:9px;line-height:1.5;}
.credential-success{color:var(--moss);font-size:13px;margin-top:9px;line-height:1.5;}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:3px;
  border:2px solid var(--spruce-900);
  background:#fff;
  color:var(--ink);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:background .12s ease, transform .05s ease;
}
.btn:hover{background:var(--parchment-dim);}
.btn:active{transform:scale(0.98);}
.btn-primary{
  background:var(--amber);
  border:2px solid var(--amber-dark);
  color:#3A2306;
  box-shadow:3px 3px 0 var(--amber-dark);
  transform:translate(0,0);
  transition:background .12s ease, transform .06s ease, box-shadow .06s ease;
}
.btn-primary:hover{background:var(--amber-dark);border-color:var(--amber-dark);color:var(--cream);}
.btn-primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--amber-dark);}
.btn-primary::before{content:'\25B6';font-size:10px;}
.btn-ghost{
  background:transparent;
  border-color:transparent;
  color:var(--ink-soft);
}
.btn-ghost:hover{background:var(--parchment-dim);}
.btn-danger{color:var(--rust);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.field-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;}
.field-row > div{flex:1;min-width:180px;}

.banner{
  border-radius:3px;
  padding:16px 20px;
  font-size:14px;
  margin-bottom:24px;
  border-width:2px;
  box-shadow:4px 4px 0 rgba(18,54,62,.16);
}
.banner-amber{background:#FCE7D2;border:1px solid #F0B67D;color:#7A3D0A;}
.banner-moss{background:#E3EFDE;border:1px solid #ABCCAA;color:#2C4D30;}
.banner-rust{background:#F7E0DC;border:1px solid #E7AFA5;color:#7A231A;}

/* BRACKET */
.bracket-card{position:relative;overflow:hidden;background:#102E36;color:var(--cream);border:4px solid var(--gold);box-shadow:8px 8px 0 var(--amber-dark);padding:28px 22px 30px;}
.bracket-card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(circle at 12px 12px,var(--gold) 0 2px,transparent 2px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px,16px 16px,16px 16px;}
.bracket-card > *{position:relative;z-index:1;}
.bracket-card .section-title{font-family:var(--font-pixel);color:var(--gold);font-size:19px;line-height:1.55;text-transform:uppercase;text-shadow:3px 3px 0 #08191E;}
.bracket-card .section-sub{color:rgba(251,239,217,.78);}
.arcade-kicker{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:#FFB52E;font-family:var(--font-pixel);font-size:8px;line-height:1.6;text-transform:uppercase;letter-spacing:.06em;}
.arcade-kicker::before,.arcade-kicker::after{content:"";height:3px;background:var(--rust);flex:1;max-width:72px;box-shadow:0 4px 0 var(--amber);}
.player-card{position:relative;background:#FFF8E8;border-left:10px solid var(--amber);overflow:hidden;}
.player-card::after{content:'P1';position:absolute;right:18px;top:16px;font-family:var(--font-pixel);font-size:13px;color:var(--rust);opacity:.8;}
.player-card .section-title{padding-right:54px;}
.player-card .section-title::before{content:'PLAYER ENTRY';display:block;font-family:var(--font-pixel);font-size:8px;line-height:1.5;color:var(--amber-dark);margin-bottom:7px;letter-spacing:.05em;}
.bracket-scroll{
  overflow-x:auto;
  padding:22px 14px 20px;
  margin:0 -8px;
  border:2px solid rgba(251,239,217,.18);
  background:rgba(5,22,27,.46);
  box-shadow:inset 0 0 0 4px rgba(5,22,27,.3);
  scrollbar-color:var(--amber) #071B20;
}
.bracket{
  display:flex;
  gap:18px;
  padding:4px;
  min-width:min-content;
  width:100%;
  justify-content:center;
}
.bracket-col{
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  min-width:180px;
}
.bracket-col-label{
  font-family:var(--font-pixel);font-size:8px;line-height:1.5;color:var(--gold);margin:0 auto 14px;
  text-align:center;
  text-transform:uppercase;background:#081C22;border:2px solid var(--amber-dark);box-shadow:3px 3px 0 #040E11;padding:7px 8px;width:calc(100% - 12px);
}
.match{
  border:3px solid #E9DDBF;
  border-radius:3px;
  overflow:hidden;
  background:#173F49;
  margin:10px 0;
  width:180px;
  box-shadow:5px 5px 0 #06171B;
}
.bear-card{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  padding:8px 10px;
  border:none;
  background:#173F49;
  font-family:inherit;
  cursor:pointer;
  border-bottom:2px solid rgba(251,239,217,.25);
  transition:background .12s ease, opacity .12s ease, filter .12s ease;
}
.bear-card:last-child{border-bottom:none;}
.bear-card:hover{background:#245C68;}
.bear-card[role="button"]:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.bear-card-photo{
  width:42px;height:42px;border-radius:2px;object-fit:cover;flex-shrink:0;background:var(--parchment-dim);border:2px solid var(--cream);
}
.bear-card-photo.placeholder{
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-size:15px;color:var(--ink-soft);
}
.bear-card-name{font-size:13px;color:var(--cream);line-height:1.25;font-weight:600;}
.bear-card.selected{background:var(--rust);padding-left:20px;}
.bear-card.selected::before{content:'\25B6';position:absolute;left:6px;color:var(--gold);font-size:10px;text-shadow:2px 2px 0 #651B14;}
.bear-card.selected .bear-card-name{color:#fff;font-weight:700;}
.bear-card.dimmed{filter:grayscale(1);opacity:.4;}
.bear-card.dimmed:hover{opacity:.7;}
.bear-card.tbd{color:var(--ink-soft);font-style:italic;cursor:default;}
.bear-card.tbd:hover{background:#173F49;}
.bear-card.tbd .bear-card-name{color:rgba(251,239,217,.55);font-style:italic;}
.bear-card.wrong{filter:grayscale(0.7);opacity:.5;}
.bear-card.wrong .bear-card-name{text-decoration:line-through;}
.bear-card.correct{background:var(--moss);}
.bear-card.correct .bear-card-name{color:#fff;font-weight:500;}
.bear-card.correct::after{content:" \2713";color:#fff;margin-left:auto;font-weight:700;}
.bye-card{
  display:flex;
  align-items:center;
  gap:10px;
  border:2px dashed rgba(251,239,217,.4);
  border-radius:3px;
  padding:8px 10px;
  font-size:13px;
  color:rgba(251,239,217,.72);
  margin:10px 0;
  background:#173F49;
  width:180px;
}
.bye-card .bear-card-photo{width:34px;height:34px;}
.champion-card{
  border:4px solid var(--gold);
  border-radius:3px;
  padding:16px;
  text-align:center;
  background:var(--rust);
  margin:10px 0;
  width:180px;
  box-shadow:6px 6px 0 #06171B;
}
.champion-card::before{content:'\265B';display:block;color:var(--gold);font-size:38px;line-height:1;margin-bottom:6px;text-shadow:3px 3px 0 #7A231A;}
.champion-card .champ-photo{
  width:82px;height:82px;border-radius:2px;object-fit:cover;margin:0 auto 10px;display:block;background:#fff;border:3px solid var(--cream);
}
.champion-card .champ-photo.placeholder{
  display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:22px;color:var(--gold-dark);
}
.champion-card .label{font-family:var(--font-pixel);font-size:9px;color:var(--gold);margin-bottom:8px;line-height:1.6;text-transform:uppercase;}
.champion-card .name{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:#fff;}
.bracket-card .btn-primary{font-family:var(--font-pixel);font-size:10px;line-height:1.5;text-transform:uppercase;padding:12px 18px;}

@media (max-width:640px){
  .bracket-card{padding:22px 14px 24px;}
  .bracket-card .section-title{font-size:15px;}
  .arcade-kicker{font-size:7px;}
}

/* LEADERBOARD */
.leaderboard-screen,.leaderboard-locked,.tournament-progress{
  position:relative;
  overflow:hidden;
  background:#102E36;
  color:var(--cream);
  border:4px solid var(--gold);
  border-radius:3px;
  box-shadow:8px 8px 0 var(--amber-dark);
}
.leaderboard-screen::before,.leaderboard-locked::before,.tournament-progress::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:radial-gradient(circle at 8px 8px,var(--gold) 0 2px,transparent 2px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:64px 64px,16px 16px,16px 16px;
}
.leaderboard-screen > *,.leaderboard-locked > *,.tournament-progress > *{position:relative;z-index:1;}
.high-score-header{text-align:center;margin-bottom:24px;}
.high-score-kicker{font-family:var(--font-pixel);font-size:8px;line-height:1.5;color:var(--amber);text-transform:uppercase;margin-bottom:10px;}
.high-score-title{font-family:var(--font-pixel);font-size:30px;line-height:1.4;color:var(--gold);text-transform:uppercase;text-shadow:4px 4px 0 var(--rust);margin:0;}
.high-score-sub{color:rgba(251,239,217,.72);font-size:13px;margin:10px 0 0;}
.tournament-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 26px;max-width:720px;}
.tournament-stat{background:#071B20;border:2px solid var(--spruce-600);box-shadow:3px 3px 0 #020A0C;padding:13px 10px;text-align:center;}
.tournament-stat-value{font-family:var(--font-pixel);font-size:18px;line-height:1.4;color:var(--gold);}
.tournament-stat-label{font-family:var(--font-pixel);font-size:7px;line-height:1.5;color:rgba(251,239,217,.68);text-transform:uppercase;margin-top:5px;}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:0 auto 28px;max-width:760px;}
.podium-card{width:31%;min-width:0;text-align:center;background:#173F49;border:3px solid var(--cream);box-shadow:5px 5px 0 #06171B;padding:17px 10px 14px;position:relative;}
.podium-card.place-1{order:2;background:var(--rust);border-color:var(--gold);padding-top:24px;min-height:174px;}
.podium-card.place-2{order:1;min-height:146px;}
.podium-card.place-3{order:3;min-height:132px;}
.podium-place{font-family:var(--font-pixel);font-size:9px;color:var(--gold);line-height:1.5;margin-bottom:10px;}
.podium-card.place-2 .podium-place{color:#D9E3E4;}.podium-card.place-3 .podium-place{color:#D98B57;}
.podium-icon{height:84px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:7px;}
.podium-medal-img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(3px 3px 0 #071B20);}
.podium-player{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.podium-score{font-family:var(--font-pixel);font-size:9px;line-height:1.5;color:var(--cream);margin-top:7px;}
.podium-you{display:inline-block;background:var(--gold);color:#3A2306;font-family:var(--font-pixel);font-size:6px;line-height:1.4;padding:3px 5px;margin-top:7px;}
.scoreboard-wrap{border:3px solid var(--cream);box-shadow:5px 5px 0 #06171B;overflow:hidden;}
table.leaderboard{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  background:#0B252C;
}
table.leaderboard th{
  text-align:left;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  padding:10px 12px;
  border-bottom:3px solid var(--amber-dark);
  background:#071B20;
  color:var(--gold);
  font-family:var(--font-pixel);
  font-size:8px;
  line-height:1.5;
  text-transform:uppercase;
}
table.leaderboard td{
  padding:12px;
  border-bottom:1px solid rgba(251,239,217,.16);
  color:var(--cream);
}
table.leaderboard tr:last-child td{border-bottom:none;}
table.leaderboard tr:nth-child(even) td{background:rgba(42,100,116,.18);}
table.leaderboard tbody tr:hover td{background:#245C68;}
.score-digits{font-family:var(--font-pixel);font-size:10px;letter-spacing:1px;color:var(--gold);}
.rank-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;height:28px;
  border-radius:3px;
  border:2px solid var(--cream);
  background:#173F49;
  font-family:var(--font-pixel);
  font-size:11px;
  color:var(--cream);
  box-shadow:2px 2px 0 #06171B;
}
.rank-badge.top{background:var(--gold);color:var(--gold-dark);border-color:var(--gold-dark);box-shadow:2px 2px 0 var(--gold-dark);}
.you-row td{background:rgba(198,58,46,.42)!important;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)!important;}
.you-row td:first-child::before{content:'\25B6';color:var(--gold);font-size:9px;margin-right:6px;}
.you-badge{display:inline-block;background:var(--gold);color:#3A2306;font-family:var(--font-pixel);font-size:6px;line-height:1.4;padding:3px 5px;margin-left:7px;vertical-align:middle;}
.accuracy-cell{min-width:130px;}
.accuracy-number{font-family:var(--font-pixel);font-size:8px;color:var(--cream);}
.accuracy-meter{height:9px;background:#06171B;border:1px solid rgba(251,239,217,.45);margin-top:6px;overflow:hidden;}
.accuracy-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--gold));}

.countdown{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:26px 0;
}
.countdown-unit{text-align:center;background:#071B20;border:2px solid var(--gold);box-shadow:4px 4px 0 #06171B;padding:14px 10px;min-width:86px;}
.countdown-num{
  font-family:var(--font-pixel);
  font-size:22px;
  line-height:1.4;
  color:var(--gold);
}
.countdown-label{font-family:var(--font-pixel);font-size:7px;line-height:1.5;color:var(--cream);text-transform:uppercase;}
.locked-icon{font-family:var(--font-pixel);font-size:34px;line-height:1;color:var(--rust);text-shadow:3px 3px 0 #06171B;margin-bottom:14px;}

  picks = picks || {};
  const round1Entries = buildRound1Entries(bears);
  const rounds = [round1Entries];
  let advancers = round1Entries.map(e=>{
    if(e.type==='bye') return e.bear;
    return picks[e.matchId] || null;
  });
  let roundNum = 2;
  while(advancers.length > 1){
    const matches = [];
    for(let i=0;i<advancers.length;i+=2){
      matches.push({
        matchId:'r'+roundNum+'m'+(i/2),
        a: advancers[i] || null,
        b: advancers[i+1] || null
      });
    }
    rounds.push(matches);
    advancers = matches.map(m=> picks[m.matchId] || null);
    roundNum++;
  }
  return rounds; // last round has exactly one match -> champion is picks[thatMatchId]
}

function allMatchIds(bears){
  const rounds = buildRounds(bears, {});
  const ids = [];
  rounds.forEach((round,i)=>{
    round.forEach(entry=>{
      if(i===0){ if(entry.type==='match') ids.push(entry.matchId); }
      else ids.push(entry.matchId);
    });
  });
  return ids;
}

/* prune picks that no longer correspond to a valid a/b pair after an upstream change */
function prunePicks(bears, picks){
  let changed = true;
  let p = Object.assign({}, picks);
  while(changed){
    changed = false;
    const rounds = buildRounds(bears, p);
    rounds.forEach((round,i)=>{
      round.forEach(entry=>{
        if(i===0 && entry.type!=='match') return;
        const mid = entry.matchId;
        if(p[mid] && entry.a!==undefined){
          if(p[mid] !== entry.a && p[mid] !== entry.b){
            delete p[mid];
            changed = true;
          }
        }
      });
    });
  }
  return p;
}

/* ---------- scoring ---------- */
function scoreSubmission(bears, submissionPicks, resultPicks){
  const ids = allMatchIds(bears);
  let correct=0, decided=0;
  ids.forEach(id=>{
    if(resultPicks[id]){
      decided++;
      if(submissionPicks[id] && submissionPicks[id]===resultPicks[id]) correct++;
    }
  });
  return {correct, decided, total: ids.length};
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
}

/* ---------- data loading ---------- */
async function loadActiveYear(){
  const v = await sget('active-year', true);
  return v ? JSON.parse(v).year : String(new Date().getFullYear());
}
async function loadConfig(year){
  const v = await sget('config:'+year, true);
  return v ? JSON.parse(v) : null;
}
async function saveConfig(year, cfg){
  await sset('config:'+year, JSON.stringify(cfg), true);
}
async function loadResults(year){
  const v = await sget('results:'+year, true);
  return v ? JSON.parse(v) : {picks:{}};
}
async function saveResults(year, res){
  await sset('results:'+year, JSON.stringify(res), true);
}
async function loadSubmission(year, name){
  const slug = slugify(name);
  if(!slug) return null;
  const v = await sget('submission:'+year+':'+slug, true);
  return v ? JSON.parse(v) : null;
}
async function authorizeSubmission(year, name, pin){
  if(!db) return {ok:false,error:"This page isn't connected to its database right now."};
  const slug = slugify(name);
  if(!slug) return {ok:false,error:'Enter a player name.'};
  if(!validPlayerPin(pin)) return {ok:false,error:'Enter a four-digit PIN.'};
  const pinHash = await hashPlayerPin(year, name, pin);
  const ref = db.collection('kv').doc('submission:'+year+':'+slug);
  try{
    const result = await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      if(!snap.exists) return {record:null,claimedLegacy:false};
      const record = JSON.parse(snap.data().value);
      if(record.pinHash && record.pinHash!==pinHash) throw new Error('PLAYER_NAME_TAKEN');
      let claimedLegacy = false;
      if(!record.pinHash){
        record.pinHash = pinHash;
        tx.set(ref,{value:JSON.stringify(record)});
        claimedLegacy = true;
      }
      return {record,claimedLegacy};
    });
    return {ok:true,record:result.record,pinHash,slug,claimedLegacy:result.claimedLegacy};
  }catch(err){
    if(err && err.message==='PLAYER_NAME_TAKEN') return {ok:false,error:playerNameTakenMessage(name)};
    console.error('Fat Bear Week: participant authorization failed',err);
    return {ok:false,error:"Couldn't verify that player right now. Try again."};
  }
}
async function saveSubmission(year, name, picks, pinHash){
  const slug = slugify(name);
  if(!db || !slug || !pinHash) return {ok:false,error:'Verify your player name and PIN first.'};
  const ref = db.collection('kv').doc('submission:'+year+':'+slug);
  try{
    const record = await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const existing = snap.exists ? JSON.parse(snap.data().value) : null;
      if(existing && existing.pinHash && existing.pinHash!==pinHash) throw new Error('PLAYER_NAME_TAKEN');
      const next = {
        name:name.trim(),
        picks,
        pinHash,
        submittedAt:existing ? existing.submittedAt : new Date().toISOString(),
        updatedAt:new Date().toISOString()
      };
      tx.set(ref,{value:JSON.stringify(next)});
      return next;
    });
    return {ok:true,record};
  }catch(err){
    if(err && err.message==='PLAYER_NAME_TAKEN') return {ok:false,error:playerNameTakenMessage(name)};
    console.error('Fat Bear Week: secure save failed',err);
    return {ok:false,error:"Couldn't save — try again."};
  }
}
async function loadAllSubmissions(year){
  const keys = await slist('submission:'+year+':', true);
  const out = [];
  for(const k of keys){
    const v = await sget(k, true);
    if(v) out.push(JSON.parse(v));
  }
  return out;
}

/* ---------- bear info modal ---------- */
function openBearInfoModal(bear){
  if(!bear) return;
  const overlay = document.getElementById('bear-info-overlay');
  const photoWrap = document.getElementById('bear-info-photo-wrap');
  const nameEl = document.getElementById('bear-info-name');
  const bodyEl = document.getElementById('bear-info-body');

  photoWrap.innerHTML = '';
  if(bear.image){
    const img = document.createElement('img');
    img.src = bear.image;
    img.alt = '';
    img.style.objectPosition = bear.imagePosition || '50% 50%';
    photoWrap.appendChild(img);
  }
  nameEl.textContent = bear.name || '';

  bodyEl.innerHTML = '';
  const hasId = bear.identification && bear.identification.trim();
  const hasBio = bear.biography && bear.biography.trim();
  if(hasId){
    const sec = document.createElement('div');
    sec.className = 'bear-info-section';
    sec.innerHTML = '<h3>Field identification</h3>';
    const p = document.createElement('p');
    p.textContent = bear.identification.trim();
    sec.appendChild(p);
    bodyEl.appendChild(sec);
  }
  if(hasBio){
    const sec = document.createElement('div');
    sec.className = 'bear-info-section';
    sec.innerHTML = '<h3>Character bio</h3>';
    const p = document.createElement('p');
    p.textContent = bear.biography.trim();
    sec.appendChild(p);
    bodyEl.appendChild(sec);
  }
  if(!hasId && !hasBio){
    const p = document.createElement('p');
    p.className = 'bear-info-empty';
    p.textContent = "Character data loading — no profile has been added for this bear yet.";
    bodyEl.appendChild(p);
  }

  overlay.classList.add('open');
  document.getElementById('bear-info-close').focus();
}
function closeBearInfoModal(){
  document.getElementById('bear-info-overlay').classList.remove('open');
}
document.getElementById('bear-info-close').onclick = closeBearInfoModal;
document.getElementById('bear-info-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'bear-info-overlay') closeBearInfoModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeBearInfoModal();

let achievementToastTimer = null;

  const toast = document.getElementById('achievement-toast');
  toast.innerHTML = `
    <span class="toast-icon">&#9733;</span>
    <span class="toast-text"><span class="toast-label">Achievement unlocked</span>${escapeHtml(text)}</span>

function bearHasInfo(bear){
  return !!(bear && ((bear.identification && bear.identification.trim()) || (bear.biography && bear.biography.trim())));
}
function addInfoButton(cardEl, bear){
  if(!bearHasInfo(bear)) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'bear-info-btn';
  btn.textContent = 'i';
  btn.setAttribute('aria-label', 'About '+bear.name);
  btn.title = 'About '+bear.name;
  btn.onclick = (e)=>{
    e.stopPropagation();
    openBearInfoModal(bear);
  };
  cardEl.appendChild(btn);
}

function bearPhotoEl(bear, sizeClass){
  if(bear && bear.image){
    const img = document.createElement('img');
    img.className = sizeClass;
    img.src = bear.image;
    img.alt = '';
    img.style.objectPosition = bear.imagePosition || '50% 50%';
    return img;
  }
  const div = document.createElement('div');
  div.className = sizeClass + ' placeholder';
  const initial = bear && bear.name ? bear.name.trim().charAt(0).toUpperCase() : '?';
  div.textContent = initial;
  return div;
}

function isPow2(n){ return n>0 && (n & (n-1))===0; }

function numRoundsPerSide(bears){
  const entries = buildRound1Entries((bears||[]).filter(b=>b.name && b.name.trim()));
  const advancerCount = entries.length;
  if(!isPow2(advancerCount) || advancerCount<2) return 0;
  return Math.log2(advancerCount);
}

function defaultRoundLabels(n){
  const left=[], right=[];
  for(let i=0;i<n;i++){
    const label = (i===n-1 && n>1) ? 'Semifinal' : 'Round '+(i+1);
    left.push(label);
    right.push(label);
  }
  return {left, right, final:'Final'};
}

function getRoundLabels(bears, configLabels){
  const n = numRoundsPerSide(bears);
  const base = defaultRoundLabels(n);
  if(!configLabels) return base;
  return {
    left: base.left.map((d,i)=> (configLabels.left && configLabels.left[i]) || d),
    right: base.right.map((d,i)=> (configLabels.right && configLabels.right[i]) || d),
    final: configLabels.final || base.final
  };
}

/* builds one bracket-col DOM node for a list of round-1 entries (match/bye) or later-round match objects */
function buildColumn(labelText, roundEntries, ri, byName, picks, opts, onPick){
  const col = document.createElement('div');
  col.className = 'bracket-col';
  const label = document.createElement('div');
  label.className = 'bracket-col-label';
  label.textContent = labelText;
  col.appendChild(label);

  roundEntries.forEach(entry=>{
    if(ri===0 && entry.type==='bye'){
      const bye = document.createElement('div');
      bye.className = 'bye-card';
      bye.appendChild(bearPhotoEl(byName[entry.bear], 'bear-card-photo'));
      const txt = document.createElement('span');
      txt.textContent = entry.bear + ' — bye, advances automatically';
      bye.appendChild(txt);
      addInfoButton(bye, byName[entry.bear]);
      col.appendChild(bye);
      return;
    }
    col.appendChild(buildMatchCell(entry, ri, byName, picks, opts, onPick));
  });

  return col;
}

function buildMatchCell(entry, ri, byName, picks, opts, onPick){
  const matchId = entry.matchId;
  const a = entry.a, b = entry.b;
  const m = document.createElement('div');
  m.className = 'match';
  if(!a && !b){
    const row = document.createElement('div');
    row.className = 'bear-card tbd';
    const ph = document.createElement('div');
    ph.className = 'bear-card-photo placeholder';
    ph.textContent = '?';
    row.appendChild(ph);
    const nameEl = document.createElement('span');
    nameEl.className = 'bear-card-name';
    nameEl.textContent = 'To be determined';
    row.appendChild(nameEl);
    m.appendChild(row);
    return m;
  }
  const hasPick = !!picks[matchId];
  [a,b].forEach(name=>{
    const el = document.createElement('div');
    let cls = 'bear-card';
    if(!name){
      cls += ' tbd';
      const ph = document.createElement('div');
      ph.className = 'bear-card-photo placeholder';
      ph.textContent = '?';
      el.appendChild(ph);
      const nameEl = document.createElement('span');
      nameEl.className = 'bear-card-name';
      nameEl.textContent = 'To be determined';
      el.appendChild(nameEl);
    } else {
      const isSelected = picks[matchId]===name;
      if(isSelected) cls += ' selected';
      else if(hasPick) cls += ' dimmed';
      if(opts.resultPicks){
        const officialWinner = opts.resultPicks[matchId];
        if(officialWinner){
          if(officialWinner===name && picks[matchId]===name) cls += ' correct';
          else if(officialWinner!==name && picks[matchId]===name) cls += ' wrong';
        }
      }
      el.appendChild(bearPhotoEl(byName[name], 'bear-card-photo'));
      const nameEl = document.createElement('span');
      nameEl.className = 'bear-card-name';
      nameEl.textContent = name;
      el.appendChild(nameEl);
      addInfoButton(el, byName[name]);
    }
    el.className = cls;
    if(!opts.readonly && name){
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.onclick = ()=> onPick(matchId, name);
      el.onkeydown = (e)=>{
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); onPick(matchId, name); }
      };
    }
    m.appendChild(el);
  });
  return m;
}

function buildFinalColumn(labelText, finalEntry, byName, picks, opts, onPick){
  const col = document.createElement('div');
  col.className = 'bracket-col';
  const label = document.createElement('div');
  label.className = 'bracket-col-label';
  label.textContent = labelText;
  col.appendChild(label);

  const a = finalEntry.a, b = finalEntry.b, matchId = finalEntry.matchId;
  const champ = document.createElement('div');
  champ.className = 'champion-card';
  const pick = picks[matchId];
  if(!a || !b){
    champ.innerHTML = '<div class="label">Champion</div><div class="champ-photo placeholder">?</div><div class="name" style="color:var(--ink-soft);font-style:italic;">To be determined</div>';
  } else if(pick){
    champ.innerHTML = '<div class="label">Champion</div>';
    champ.appendChild(bearPhotoEl(byName[pick], 'champ-photo'));
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = pick;
    champ.appendChild(nameEl);
    addInfoButton(champ, byName[pick]);
  } else {
    champ.innerHTML = '<div class="label">Champion</div><div class="champ-photo placeholder">?</div><div class="name" style="color:var(--ink-soft);">Pick one below</div>';
  }
  col.appendChild(champ);
  if(a && b && !opts.readonly){
    col.appendChild(buildMatchCell(finalEntry, -1, byName, picks, opts, onPick));
  }
  return col;
}

/* Redraws a bracket container while preserving its horizontal scroll position,
   since a full rebuild on every pick would otherwise snap back to the left. */
function redrawBracketPreservingScroll(container, drawFn){
  const existingScroller = container.querySelector('.bracket-scroll');
  const scrollLeft = existingScroller ? existingScroller.scrollLeft : 0;
  drawFn();
  const newScroller = container.querySelector('.bracket-scroll');
  if(newScroller) newScroller.scrollLeft = scrollLeft;
}

function renderBracketTree(container, bears, picks, opts, onPick){
  opts = opts || {};
  const byName = {};
  (bears||[]).forEach(b=>{ if(b.name) byName[b.name] = b; });
  const rounds = buildRounds(bears, picks);
  const wrap = document.createElement('div');
  wrap.className = 'bracket-scroll';
  const bracket = document.createElement('div');
  bracket.className = 'bracket';

  const advancerCount = rounds[0].length;
  const finalIdx = rounds.length-1;

  if(isPow2(advancerCount) && advancerCount>=2){
    const labels = getRoundLabels(bears, opts.roundLabels);
    const n = finalIdx; // rounds per side, excludes final round itself

    for(let r=0; r<n; r++){
      const full = rounds[r];
      const half = full.length/2;
      const leftEntries = full.slice(0, half);
      bracket.appendChild(buildColumn(labels.left[r] || ('Round '+(r+1)), leftEntries, r, byName, picks, opts, onPick));
    }

    bracket.appendChild(buildFinalColumn(labels.final || 'Final', rounds[finalIdx][0], byName, picks, opts, onPick));

    for(let r=n-1; r>=0; r--){
      const full = rounds[r];
      const half = full.length/2;
      const rightEntries = full.slice(half);
      bracket.appendChild(buildColumn(labels.right[r] || ('Round '+(r+1)), rightEntries, r, byName, picks, opts, onPick));
    }
  } else {
    // fallback: simple left-to-right linear layout (used only while the bracket setup is invalid)
    rounds.forEach((round, ri)=>{
      const labelText = (ri===0) ? 'Round 1' : (ri===finalIdx ? 'Champion' : 'Round '+(ri+1));
      if(ri===finalIdx){
        bracket.appendChild(buildFinalColumn(labelText, round[0], byName, picks, opts, onPick));
      } else {
        bracket.appendChild(buildColumn(labelText, round, ri, byName, picks, opts, onPick));
      }
    });
  }

  wrap.appendChild(bracket);
  container.appendChild(wrap);
}

      <div class="card">
        <h2 class="section-title">The ${state.activeYear} lineup isn't set yet</h2>

    b.className = 'banner banner-moss';
    b.innerHTML = 'Voting has started — brackets are locked. <a href="#" id="go-leaderboard" style="color:inherit;font-weight:600;">See the leaderboard &rsaquo;</a>';

    b.querySelector('#go-leaderboard').onclick = (e)=>{ e.preventDefault(); switchView('leaderboard'); };
  } else {
    const b = document.createElement('div');
    b.className = 'banner banner-amber';
    b.textContent = 'Submissions lock at ' + fmtDate(cfg.votingStartISO || DEFAULT_VOTING_START) + '. You can update your picks until then.';
    page.appendChild(b);
  }

  const nameCard = document.createElement('div');
  nameCard.className = 'card player-card';
  nameCard.innerHTML = `
    <h2 class="section-title">Player login</h2>
    <p class="section-sub">Choose a unique leaderboard name and a private four-digit PIN. Returning players use the same combination to load their bracket.</p>
    <div class="field-row">

        <label for="name-input">Leaderboard name</label>

        <label for="pin-input">Four-digit PIN</label>

        <p class="pin-help" id="pin-help">Keep this PIN—you'll need it to make changes later.</p>
      </div>
      <button class="btn" id="load-btn">Load or start player</button>
    </div>
    <div id="name-status"></div>
  `;
  const nameFullBleed = document.createElement('div');
  nameFullBleed.className = 'full-bleed';
  nameFullBleed.style.marginBottom = '24px';
  nameFullBleed.appendChild(nameCard);
  page.appendChild(nameFullBleed);

  const bracketCard = document.createElement('div');
  bracketCard.className = 'card bracket-card';
  bracketCard.innerHTML = `<div class="arcade-kicker">Player select &bull; ${escapeHtml(String(state.activeYear || ''))} tournament</div>
    <h2 class="section-title">${escapeHtml(cfg.eventName || 'Bracket')}</h2>
    <p class="section-sub">${locked ? 'Your locked-in picks.' : 'Pick a winner for each matchup — your pick carries forward into the next round automatically.'}</p>`;

    redrawBracketPreservingScroll(bracketMount, ()=>{
      bracketMount.innerHTML = '';
      renderBracketTree(bracketMount, cfg.bears, state.userPicks, {readonly: locked, roundLabels: cfg.roundLabels}, (matchId, bearName)=>{
        state.userPicks[matchId] = bearName;
        state.userPicks = prunePicks(cfg.bears, state.userPicks);
        drawBracket();
      });
    });

    const nameInput = document.getElementById('name-input');
    const pinInput = document.getElementById('pin-input');
    const name = nameInput.value.trim();
    const pin = pinInput.value.trim();
    const statusEl = document.getElementById('name-status');
    if(!name){
      statusEl.innerHTML = '<p class="credential-error">Enter a leaderboard name first.</p>';
      return;
    }
    if(!validPlayerPin(pin)){
      statusEl.innerHTML = '<p class="credential-error">Enter exactly four numbers for your PIN.</p>';
      return;
    }
    statusEl.innerHTML = '<p class="pin-help">Checking player…</p>';
    const access = await authorizeSubmission(state.activeYear, name, pin);
    if(!access.ok){
      state.userAccessGranted = false;
      state.userPinHash = '';
      statusEl.innerHTML = '<p class="credential-error">'+escapeHtml(access.error)+'</p>';
      return;
    }
    state.userName = name;
    state.userSlug = access.slug;
    state.userPinHash = access.pinHash;
    state.userAccessGranted = true;
    if(access.record){
      state.userPicks = access.record.picks || {};
      statusEl.innerHTML = '<p class="credential-success">'+(access.claimedLegacy?'PIN added to your existing bracket. ':'')+'Loaded your saved bracket from '+fmtDate(access.record.updatedAt)+'.</p>';
