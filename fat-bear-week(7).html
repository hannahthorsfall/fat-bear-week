      state.userPicks = {};
      statusEl.innerHTML = '<p class="credential-success">Player name available—starting a new bracket. Remember your PIN.</p>';
    }
    drawBracket();
  };

  ['name-input','pin-input'].forEach(id=>{
    document.getElementById(id).addEventListener('input',()=>{ state.userAccessGranted=false; });
  });
  document.getElementById('pin-input').addEventListener('keydown',e=>{
    if(e.key==='Enter') document.getElementById('load-btn').click();
  });

  if(!locked){
    document.getElementById('submit-btn').onclick = async ()=>{
      const nameInput = document.getElementById('name-input');
      const pinInput = document.getElementById('pin-input');
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim();
      const statusEl = document.getElementById('submit-status');
      if(!name){
        statusEl.textContent = 'Enter your name above first.';
        statusEl.style.color = 'var(--rust)';
        return;
      }
      if(!validPlayerPin(pin)){
        statusEl.textContent = 'Enter your four-digit PIN above.';
        statusEl.style.color = 'var(--rust)';
        return;
      }
      const typedHash = await hashPlayerPin(state.activeYear,name,pin);
      if(!state.userAccessGranted || state.userSlug!==slugify(name) || state.userPinHash!==typedHash){
        statusEl.textContent = 'Click “Load or start player” above before saving.';
        statusEl.style.color = 'var(--rust)';
        return;
      }
      statusEl.textContent = 'Saving…';
      statusEl.style.color = 'var(--ink-soft)';
      const saved = await saveSubmission(state.activeYear, name, state.userPicks, state.userPinHash);
      if(saved.ok){
        state.userName = name;
        statusEl.textContent = 'Saved just now.';
        statusEl.style.color = 'var(--moss)';
        showAchievementToast('Bracket saved!');
      } else {
        state.userAccessGranted = false;
        statusEl.textContent = saved.error || "Couldn't save — try again.";
        statusEl.style.color = 'var(--rust)';
      }
    };
  }
}

async function renderLeaderboard(){
  app.innerHTML = '';
  const page = document.createElement('div');
  page.className = 'page';
  app.appendChild(page);

  const cfg = state.config;
  if(!cfg || !cfg.bears || cfg.bears.filter(b=>b.name).length < 2){
    page.innerHTML = `<div class="card"><h2 class="section-title">Leaderboard</h2>
      <p class="section-sub" style="margin-bottom:0;">The bracket for ${state.activeYear} hasn't been set up yet.</p></div>`;
    return;
  }

  const now = new Date();
  const votingStart = new Date(cfg.votingStartISO || DEFAULT_VOTING_START);

  if(now < votingStart){
    const card = document.createElement('div');
    card.className = 'card leaderboard-locked';
    card.innerHTML = `<div class="high-score-header">
      <div class="locked-icon">[X]</div>
      <div class="high-score-kicker">Fat Bear Week Pool &bull; ${escapeHtml(String(state.activeYear || ''))}</div>
      <h2 class="high-score-title">High Scores Locked</h2>
      <p class="high-score-sub">Standings unlock once voting starts, so nobody gets an early peek.</p>
      </div>
      <div class="countdown" id="countdown"></div>
      <p style="font-size:13px;color:rgba(251,239,217,.7);text-align:center;">Tournament begins ${fmtDate(cfg.votingStartISO || DEFAULT_VOTING_START)}.</p>`;
    page.appendChild(card);
    const cdEl = card.querySelector('#countdown');
    function tick(){
      const diff = votingStart - new Date();
      if(diff<=0){ renderLeaderboard(); return; }
      const d = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      cdEl.innerHTML = [['Days',d],['Hrs',h],['Min',m],['Sec',s]].map(([label,val])=>
        `<div class="countdown-unit"><div class="countdown-num">${val}</div><div class="countdown-label">${label}</div></div>`
      ).join('');
    }
    tick();
    state._countdownInterval && clearInterval(state._countdownInterval);
    state._countdownInterval = setInterval(tick, 1000);
    return;
  }

  const results = await loadResults(state.activeYear);
  const submissions = await loadAllSubmissions(state.activeYear);

  const scored = submissions.map(s=>{
    const sc = scoreSubmission(cfg.bears, s.picks || {}, results.picks || {});
    return Object.assign({}, s, sc);
  });
  scored.sort((a,b)=> b.correct - a.correct);

  const card = document.createElement('div');
  card.className = 'card leaderboard-screen';
  const officialDecided = Object.keys((results && results.picks) || {}).length;
  const totalMatches = Math.max(0, cfg.bears.filter(b=>b.name && b.name.trim()).length - 1);
  const podiumHtml = scored.slice(0,3).map((s,i)=>{
    const place = i + 1;
    const isYou = state.userName && slugify(state.userName)===slugify(s.name);
    const medalSrc = place===1 ? MEDAL_IMG_1 : place===2 ? MEDAL_IMG_2 : MEDAL_IMG_3;
    const icon = `<img src="${medalSrc}" alt="" class="podium-medal-img">`;
    return `<div class="podium-card place-${place}">
      <div class="podium-place">${place===1?'1ST / TOP BEAR':place===2?'2ND PLACE':'3RD PLACE'}</div>
      <div class="podium-icon">${icon}</div>
      <div class="podium-player" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
      <div class="podium-score">${s.correct} / ${s.decided}</div>
      ${isYou?'<span class="podium-you">P1 / YOU</span>':''}
    </div>`;
  }).join('');
  let rowsHtml = '';
  if(scored.length===0){
    rowsHtml = `<tr><td colspan="4" style="color:rgba(251,239,217,.7);padding:22px;text-align:center;">No players have entered the high-score table yet.</td></tr>`;
  } else {
    let rank = 0, lastScore = null, shown = 0;
    scored.forEach((s)=>{
      shown++;
      if(s.correct !== lastScore){ rank = shown; lastScore = s.correct; }
      const isTop = rank===1 && s.correct>0;
      const isYou = state.userName && slugify(state.userName)===slugify(s.name);
      const accuracy = s.decided ? Math.round(s.correct/s.decided*100) : 0;
      rowsHtml += `<tr class="${isYou?'you-row':''}">
        <td data-label="Rank"><span class="rank-badge${isTop?' top':''}">${rank}</span></td>
        <td data-label="Player">${escapeHtml(s.name)}${isYou?' <span class="you-badge">P1 / YOU</span>':''}</td>
        <td data-label="Picks"><span class="score-digits">${s.correct} / ${s.decided}</span></td>
        <td data-label="Accuracy" class="accuracy-cell"><span class="accuracy-number">${s.decided ? accuracy+'%' : '—'}</span>${s.decided?`<div class="accuracy-meter" aria-label="${accuracy}% accuracy"><div class="accuracy-fill" style="width:${accuracy}%"></div></div>`:''}</td>
      </tr>`;
    });
  }
  card.innerHTML = `
    <div class="high-score-header">
      <div class="high-score-kicker">Fat Bear Week Pool &bull; ${escapeHtml(String(state.activeYear || ''))}</div>
      <h2 class="high-score-title">High Scores</h2>
      <p class="high-score-sub">Ranked by correct picks against the official tournament so far.</p>
    </div>
    <div class="tournament-stats">
      <div class="tournament-stat"><div class="tournament-stat-value">${submissions.length}</div><div class="tournament-stat-label">Players Entered</div></div>
      <div class="tournament-stat"><div class="tournament-stat-value">${officialDecided}</div><div class="tournament-stat-label">Matches Decided</div></div>
      <div class="tournament-stat"><div class="tournament-stat-value">${totalMatches}</div><div class="tournament-stat-label">Total Matchups</div></div>
    </div>
    ${podiumHtml?`<div class="podium">${podiumHtml}</div>`:''}
    <div class="scoreboard-wrap">
      <table class="leaderboard">
        <thead><tr><th>Rank</th><th>Player</th><th>Picks</th><th>Accuracy</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
  page.appendChild(card);

  if(results.picks && Object.keys(results.picks).length>0){
    const officialCard = document.createElement('div');
    officialCard.className = 'card tournament-progress';
    officialCard.innerHTML = `<div class="arcade-kicker">Live game board &bull; official results</div><h2 class="section-title">Tournament Progress</h2><p class="section-sub">The official Fat Bear Week bracket as results are entered by the pool organizer.</p>`;
    const mount = document.createElement('div');
    officialCard.appendChild(mount);
    renderBracketTree(mount, cfg.bears, results.picks, {readonly:true, roundLabels: cfg.roundLabels}, ()=>{});
    const officialFullBleed = document.createElement('div');
    officialFullBleed.className = 'full-bleed';
    officialFullBleed.style.marginTop = '24px';
    officialFullBleed.appendChild(officialCard);
    page.appendChild(officialFullBleed);
  }
}

/* ---------- admin ---------- */
async function renderAdmin(){
  app.innerHTML = '';
  const page = document.createElement('div');
  page.className = 'page admin-page';
  app.appendChild(page);

  if(!state.adminAuthed){
    const card = document.createElement('div');
    page.className = 'page page-narrow admin-login';
    card.className = 'card admin-login-card';
    card.innerHTML = `
      <h2 class="section-title">Admin sign in</h2>
      <p class="section-sub">Continue with the authorized Google account to enter the Tournament Control Room. Google and Firebase handle the sign-in securely; no admin password is stored in this page.</p>
      <button class="btn google-signin-btn" id="admin-google-btn"><span class="google-g" aria-hidden="true">G</span> Continue with Google</button>
      <p id="auth-status" class="credential-error" role="alert" style="display:none;"></p>
    `;
    page.appendChild(card);
    document.getElementById('admin-google-btn').onclick = async ()=>{
      const statusEl = document.getElementById('auth-status');
      if(!auth){
        statusEl.textContent = 'Firebase Authentication is not configured yet.';
        statusEl.style.display = 'block';
        return;
      }
      statusEl.textContent = 'Opening Google sign-in…';
      statusEl.style.display = 'block';
      try{
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({prompt:'select_account'});
        const result = await auth.signInWithPopup(provider);
        if(ADMIN_UID==='PASTE_YOUR_FIREBASE_ADMIN_UID_HERE'){
          const setupUid = result.user.uid;
          await auth.signOut();
          statusEl.textContent = 'Google account connected. Your Firebase UID is '+setupUid+'. Add it to ADMIN_UID and the Firestore rules, then upload the updated file.';
          return;
        }
        if(!isAuthorizedAdmin(result.user)){
          await auth.signOut();
          throw new Error('UNAUTHORIZED_ADMIN');
        }
        state.adminUser = result.user;
        state.adminAuthed = true;
        renderAdmin();
      }catch(err){
        console.error('Fat Bear Week: admin sign-in failed',err && err.code);
        statusEl.textContent = err && err.message==='UNAUTHORIZED_ADMIN'
          ? 'That Google account is not authorized for this control room.'
          : 'Google sign-in did not complete. Check that the Google provider and this site domain are enabled in Firebase, then try again.';
      }
    };
    return;
  }

  // authed
  // Remove the obsolete plaintext passcode record after the first successful
  // Firebase-authenticated admin visit. It is no longer used anywhere.
  await sdelete('admin-passcode', true);
  state.adminYear = state.adminYear || state.activeYear;
  state.adminConfig = state.adminConfig || JSON.parse(JSON.stringify(state.config || {bears:[], votingStartISO: DEFAULT_VOTING_START, eventName:'Fat Bear Week Bracket'}));
  if(!state.adminConfig.bears) state.adminConfig.bears = [];

  const controlHeader = document.createElement('div');
  controlHeader.className = 'admin-control-header';
  controlHeader.innerHTML = `<div class="high-score-kicker">Authorized users only &bull; ${escapeHtml(String(state.adminYear || ''))}</div><h1>Tournament Control Room</h1><p>Configure the field, update official results, and manage player brackets from one responsive dashboard.${state.adminUser&&state.adminUser.email?' Signed in as '+escapeHtml(state.adminUser.email)+'.':''}</p>`;
  page.appendChild(controlHeader);

  const adminTopGrid = document.createElement('div');
  adminTopGrid.className = 'admin-top-grid';
  page.appendChild(adminTopGrid);

  const yearCard = document.createElement('div');
  yearCard.className = 'card admin-card admin-year-card';
  yearCard.innerHTML = `
    <h2 class="section-title">Year</h2>
    <p class="section-sub">Data is kept separate per year so nothing gets mixed up.</p>
    <div class="field-row">
      <div>
        <label for="year-select">Editing year</label>
        <input type="text" id="year-select" value="${escapeHtml(state.adminYear)}" style="max-width:120px;">
      </div>
      <button class="btn" id="load-year-btn">Load this year</button>
      <button class="btn btn-primary" id="make-active-btn">Make this the active year</button>
    </div>
    <p style="font-size:13px;color:var(--ink-soft);margin:0;">Active year right now: <strong>${escapeHtml(state.activeYear)}</strong> (this is what your friends see when they open the link).</p>
  `;
  adminTopGrid.appendChild(yearCard);

  document.getElementById('load-year-btn').onclick = async ()=>{
    const y = document.getElementById('year-select').value.trim();
    if(!y) return;
    state.adminYear = y;
    const cfg = await loadConfig(y);
    state.adminConfig = cfg || {bears:[], votingStartISO: DEFAULT_VOTING_START, eventName:'Fat Bear Week Bracket'};
    state.adminResults = null;
    renderAdmin();
  };
  document.getElementById('make-active-btn').onclick = async ()=>{
    const y = document.getElementById('year-select').value.trim();
    if(!y) return;
    await sset('active-year', JSON.stringify({year:y}), true);
    state.activeYear = y;
    state.config = await loadConfig(y);
    renderAdmin();
  };

  // testing card
  const testCard = document.createElement('div');
  testCard.className = 'card admin-card admin-test-card';
  testCard.innerHTML = `
    <h2 class="section-title">Test with real 2025 data</h2>
    <p class="section-sub">Loads your actual 2025 pool — 12 bears, 28 participants' picks, and the official results — into year <strong>2025</strong> so you can click through every page. It won't touch 2026 or whichever year is active for your friends unless you switch to it yourself.</p>
    <button class="btn" id="load-sample-btn">Load 2025 sample data</button>
    <button class="btn btn-ghost" id="clear-sample-btn" style="color:var(--rust);">Clear 2025 sample data</button>
    <span id="sample-status" style="font-size:13px;color:var(--ink-soft);margin-left:8px;"></span>
  `;
  adminTopGrid.appendChild(testCard);
  if(state.adminSampleMessage){
    const statusEl = testCard.querySelector('#sample-status');
    statusEl.textContent = state.adminSampleMessage.text;
    statusEl.style.color = state.adminSampleMessage.color;
    state.adminSampleMessage = null;
  }

  document.getElementById('load-sample-btn').onclick = async ()=>{
    const statusEl = document.getElementById('sample-status');
    if(!state.storageOk){
      statusEl.textContent = "Can't save — this page isn't connected to its database. Check the Firebase setup in the file, then refresh.";
      statusEl.style.color = 'var(--rust)';
      return;
    }
    statusEl.textContent = 'Loading…';
    statusEl.style.color = 'var(--ink-soft)';
    try{
      await load2025SampleData();
      const check = await loadConfig('2025');
      if(!check || !check.bears || check.bears.length < 12){
        throw new Error('Data did not persist as expected');
      }
      state.adminYear = '2025';
      state.adminConfig = check;
      state.adminResults = null;
      state.adminSampleMessage = {text:'Loaded — 12 bears, official results, and 28 submissions for 2025.', color:'var(--moss)'};
      renderAdmin();
    }catch(err){
      console.error('Fat Bear Week: failed to load sample data', err);
      statusEl.textContent = "Something went wrong loading the sample data. Try refreshing the page and clicking again.";
      statusEl.style.color = 'var(--rust)';
    }
  };
  document.getElementById('clear-sample-btn').onclick = async ()=>{
    const statusEl = document.getElementById('sample-status');
    if(!state.storageOk){
      statusEl.textContent = "Can't clear — this page isn't connected to its database right now.";
      statusEl.style.color = 'var(--rust)';
      return;
    }
    statusEl.textContent = 'Clearing…';
    statusEl.style.color = 'var(--ink-soft)';
    try{
      await clear2025SampleData();
      if(state.adminYear==='2025'){ state.adminConfig = {bears:[], votingStartISO: DEFAULT_VOTING_START, eventName:'Fat Bear Week Bracket'}; state.adminResults = null; }
      state.adminSampleMessage = {text:'Cleared 2025 sample data.', color:'var(--ink-soft)'};
      renderAdmin();
    }catch(err){
      console.error('Fat Bear Week: failed to clear sample data', err);
      statusEl.textContent = "Something went wrong clearing the sample data. Try again.";
      statusEl.style.color = 'var(--rust)';
    }
  };

  // config card
  const cfgCard = document.createElement('div');
  cfgCard.className = 'card admin-card admin-config-card';
  cfgCard.innerHTML = `
    <h2 class="section-title">Bracket setup — ${escapeHtml(state.adminYear)}</h2>
    <p class="section-sub">List the bears in the order they appear in the official bracket. Pair them up top to bottom; check "bye" for any bear who skips round 1.</p>
    <div class="field-row">
      <div><label for="event-name">Bracket name</label><input type="text" id="event-name" value="${escapeHtml(state.adminConfig.eventName||'Fat Bear Week Bracket')}"></div>
      <div><label for="voting-start">Voting starts</label><input type="datetime-local" id="voting-start" value="${isoToLocalInput(state.adminConfig.votingStartISO || DEFAULT_VOTING_START)}"></div>
    </div>
    <label>Bears</label>
    <p style="font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;">Click anywhere on a bear's photo to keep that spot in frame — useful if a face gets cropped out.</p>
    <div id="bear-rows"></div>
    <button class="btn" id="add-bear-btn" style="margin-top:8px;">Add a bear</button>
    <div id="config-warning" style="margin-top:14px;"></div>
    <div id="round-labels-section" style="margin-top:20px;"></div>
    <div id="bracket-preview-wrap" style="margin-top:24px;"></div>
    <div class="admin-save-row">
      <button class="btn btn-primary" id="save-config-btn">Save bracket setup</button>
      <span id="config-status" style="font-size:13px;color:var(--ink-soft);margin-left:10px;"></span>
    </div>
  `;
  page.appendChild(cfgCard);

  function drawBearRows(){
    const rowsEl = cfgCard.querySelector('#bear-rows');
    rowsEl.innerHTML = '';
    state.adminConfig.bears.forEach((b, i)=>{
      const row = document.createElement('div');
      row.className = 'admin-bear-row';
      row.draggable = true;
      row.dataset.i = i;

      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.title = 'Drag to reorder';
      handle.innerHTML = '&#8942;&#8942;';
      row.appendChild(handle);

      const idxEl = document.createElement('span');
      idxEl.className = 'idx';
      idxEl.textContent = (i+1)+'.';
      row.appendChild(idxEl);

      if(b.image){
        const thumb = document.createElement('img');
        thumb.className = 'bear-photo-thumb';
        thumb.src = b.image;
        thumb.style.objectPosition = b.imagePosition || '50% 50%';
        thumb.title = 'Click a spot on the photo to keep it in frame';
        thumb.onclick = (e)=>{
          const rect = thumb.getBoundingClientRect();
          const xPct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
          const yPct = Math.round(((e.clientY - rect.top) / rect.height) * 100);
          state.adminConfig.bears[i].imagePosition = `${xPct}% ${yPct}%`;
          thumb.style.objectPosition = state.adminConfig.bears[i].imagePosition;
        };
        row.appendChild(thumb);
      } else {
        const thumb = document.createElement('div');
        thumb.className = 'bear-photo-thumb-placeholder';
        thumb.textContent = 'no photo';
        row.appendChild(thumb);
      }

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'Bear name, e.g. 32 Chunk';
      nameInput.value = b.name || '';
      nameInput.className = 'bear-name';
      nameInput.dataset.i = i;
      row.appendChild(nameInput);

      const photoInput = document.createElement('input');
      photoInput.type = 'file';
      photoInput.accept = 'image/*';
      photoInput.className = 'bear-photo-input';
      photoInput.dataset.i = i;
      const photoControls = document.createElement('div');
      photoControls.className = 'admin-photo-controls';
      photoControls.appendChild(photoInput);
      row.appendChild(photoControls);

      if(b.image){
        const removeBtn = document.createElement('button');
        removeBtn.className = 'icon-btn bear-photo-remove';
        removeBtn.dataset.i = i;
        removeBtn.title = 'Remove photo';
        removeBtn.innerHTML = '&times;';
        photoControls.appendChild(removeBtn);
      }

      const actionGroup = document.createElement('div');
      actionGroup.className = 'admin-bear-actions';

      const byeLabel = document.createElement('label');
      const byeCheckbox = document.createElement('input');
      byeCheckbox.type = 'checkbox';
      byeCheckbox.checked = !!b.bye;
      byeCheckbox.className = 'bear-bye';
      byeCheckbox.dataset.i = i;
      byeLabel.appendChild(byeCheckbox);
      byeLabel.appendChild(document.createTextNode('Bye'));
      actionGroup.appendChild(byeLabel);

      const upBtn = document.createElement('button');
      upBtn.className = 'icon-btn bear-up';
      upBtn.dataset.i = i;
      upBtn.title = 'Move up';
      upBtn.innerHTML = '&uarr;';
      actionGroup.appendChild(upBtn);

      const downBtn = document.createElement('button');
      downBtn.className = 'icon-btn bear-down';
      downBtn.dataset.i = i;
      downBtn.title = 'Move down';
      downBtn.innerHTML = '&darr;';
      actionGroup.appendChild(downBtn);

      const bioBtn = document.createElement('button');
      bioBtn.className = 'icon-btn bear-bio-toggle';
      bioBtn.dataset.i = i;
      bioBtn.title = 'Edit bio';
      bioBtn.textContent = 'i';
      if(state.adminBioExpanded.has(i)) bioBtn.classList.add('active');
      actionGroup.appendChild(bioBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn bear-del';
      delBtn.dataset.i = i;
      delBtn.title = 'Remove';
      delBtn.innerHTML = '&times;';
      actionGroup.appendChild(delBtn);
      row.appendChild(actionGroup);

      rowsEl.appendChild(row);

      if(state.adminBioExpanded.has(i)){
        const bioPanel = document.createElement('div');
        bioPanel.className = 'admin-bio-panel';
        bioPanel.innerHTML = `
          <label style="font-size:12px;">Identification</label>
          <textarea class="bear-identification" data-i="${i}" rows="2" placeholder="Physical description — size, fur color, distinguishing marks...">${escapeHtml(b.identification||'')}</textarea>
          <label style="font-size:12px;">Biography</label>
          <textarea class="bear-biography" data-i="${i}" rows="4" placeholder="Background, behavior, notable history...">${escapeHtml(b.biography||'')}</textarea>
        `;
        rowsEl.appendChild(bioPanel);
      }
    });
    rowsEl.querySelectorAll('.bear-bio-toggle').forEach(el=>{
      el.onclick = ()=>{
        const i = +el.dataset.i;
        if(state.adminBioExpanded.has(i)) state.adminBioExpanded.delete(i);
        else state.adminBioExpanded.add(i);
        drawBearRows();
      };
    });
    rowsEl.querySelectorAll('.bear-identification').forEach(el=>{
      el.oninput = ()=>{ state.adminConfig.bears[+el.dataset.i].identification = el.value; };
    });
    rowsEl.querySelectorAll('.bear-biography').forEach(el=>{
      el.oninput = ()=>{ state.adminConfig.bears[+el.dataset.i].biography = el.value; };
    });
    rowsEl.querySelectorAll('.bear-name').forEach(el=>{
      el.oninput = ()=>{ state.adminConfig.bears[+el.dataset.i].name = el.value; updateWarning(); };
    });
    rowsEl.querySelectorAll('.bear-bye').forEach(el=>{
      el.onchange = ()=>{ state.adminConfig.bears[+el.dataset.i].bye = el.checked; updateWarning(); };
    });
    rowsEl.querySelectorAll('.bear-del').forEach(el=>{
      el.onclick = ()=>{ state.adminConfig.bears.splice(+el.dataset.i,1); drawBearRows(); updateWarning(); };
    });
    rowsEl.querySelectorAll('.bear-up').forEach(el=>{
      el.onclick = ()=>{
        const i = +el.dataset.i;
        if(i===0) return;
        const arr = state.adminConfig.bears;
        [arr[i-1],arr[i]] = [arr[i],arr[i-1]];
        drawBearRows(); updateWarning();
      };
    });
    rowsEl.querySelectorAll('.bear-down').forEach(el=>{
      el.onclick = ()=>{
        const i = +el.dataset.i;
        const arr = state.adminConfig.bears;
        if(i===arr.length-1) return;
        [arr[i+1],arr[i]] = [arr[i],arr[i+1]];
        drawBearRows(); updateWarning();
      };
    });
    rowsEl.querySelectorAll('.bear-photo-remove').forEach(el=>{
      el.onclick = ()=>{
        state.adminConfig.bears[+el.dataset.i].image = null;
        state.adminConfig.bears[+el.dataset.i].imagePosition = null;
        drawBearRows(); updateWarning();
      };
    });
    rowsEl.querySelectorAll('.bear-photo-input').forEach(el=>{
      el.onchange = async ()=>{
        const i = +el.dataset.i;
        const file = el.files && el.files[0];
        if(!file) return;
        if(!file.type.startsWith('image/')){
          alert('Please choose an image file.');
          return;
        }
        try{
          const dataUrl = await resizeImageFile(file, 180, 0.6);
          state.adminConfig.bears[i].image = dataUrl;
          state.adminConfig.bears[i].imagePosition = '50% 50%';
          drawBearRows();
          updateWarning();
        }catch(err){
          alert("Couldn't process that image — try a different file.");
        }
      };
    });
    rowsEl.querySelectorAll('.admin-bear-row').forEach(rowEl=>{
      rowEl.addEventListener('dragstart', (e)=>{
        rowEl.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', rowEl.dataset.i);
      });
      rowEl.addEventListener('dragend', ()=>{
        rowEl.classList.remove('dragging');
        rowsEl.querySelectorAll('.admin-bear-row').forEach(r=>r.classList.remove('drag-over'));
      });
      rowEl.addEventListener('dragover', (e)=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        rowEl.classList.add('drag-over');
      });
      rowEl.addEventListener('dragleave', ()=>{
        rowEl.classList.remove('drag-over');
      });
      rowEl.addEventListener('drop', (e)=>{
        e.preventDefault();
        rowEl.classList.remove('drag-over');
        const fromIdx = +e.dataTransfer.getData('text/plain');
        const toIdx = +rowEl.dataset.i;
        if(fromIdx===toIdx) return;
        const arr = state.adminConfig.bears;
        const [moved] = arr.splice(fromIdx, 1);
        arr.splice(toIdx, 0, moved);
        drawBearRows();
        updateWarning();
      });
    });
    updateWarning();
  }

  function updateWarning(){
    const warnEl = cfgCard.querySelector('#config-warning');
    const bears = state.adminConfig.bears.filter(b=>b.name && b.name.trim());
    if(bears.length < 2){
      warnEl.innerHTML = '';
      cfgCard.querySelector('#round-labels-section').innerHTML = '';
      cfgCard.querySelector('#bracket-preview-wrap').innerHTML = '';
      return;
    }
    const entries = buildRound1Entries(bears);
    const advancerCount = entries.length;
    const isPow2 = advancerCount>0 && (advancerCount & (advancerCount-1))===0;
    let html = '';
    if(!isPow2){
      html += `<div class="banner banner-rust" style="margin:0 0 10px;">After round 1, ${advancerCount} bears advance. That's not a clean power of two (4, 8, 16…), so later rounds won't pair evenly. Adjust byes or add/remove a bear.</div>`;
    } else {
      const totalMatches = allMatchIds(bears).length;
      html += `<div class="banner banner-moss" style="margin:0 0 10px;">Looks good — ${bears.length} bears, ${advancerCount} advance past round 1, ${totalMatches} total matches to pick.</div>`;
    }
    const approxBytes = JSON.stringify(state.adminConfig).length;
    if(approxBytes > 700000){
      html += `<div class="banner banner-rust" style="margin:0;">This year's setup is getting large (~${Math.round(approxBytes/1024*10)/10}KB) with all the photos included — the database can't store a single item over 1MB. Use smaller or fewer photos, or lower-resolution originals.</div>`;
    }
    warnEl.innerHTML = html;
    drawRoundLabels(bears, isPow2);
    drawBracketPreview(bears);
  }

  function drawBracketPreview(bears){
    const wrap = cfgCard.querySelector('#bracket-preview-wrap');
    wrap.innerHTML = '';
    const label = document.createElement('label');
    label.textContent = 'Bracket preview';
    wrap.appendChild(label);
    const hint = document.createElement('p');
    hint.style.cssText = 'font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;';
    hint.textContent = "This is exactly how the bracket will look to participants — check that every pairing and bye is correct before saving.";
    wrap.appendChild(hint);
    const mount = document.createElement('div');
    wrap.appendChild(mount);
    const roundLabels = getRoundLabels(bears, state.adminConfig.roundLabels);
    renderBracketTree(mount, bears, {}, {readonly:true, roundLabels}, ()=>{});
  }

  function drawRoundLabels(bears, isPow2){
    const section = cfgCard.querySelector('#round-labels-section');
    if(bears.length<2 || !isPow2){
      section.innerHTML = '';
      return;
    }
    const n = numRoundsPerSide(bears);
    if(!state.adminConfig.roundLabels) state.adminConfig.roundLabels = {left:[],right:[],final:'Final'};
    const rl = state.adminConfig.roundLabels;
    const defaults = defaultRoundLabels(n);
    section.innerHTML = `
      <label>Round labels <span style="font-weight:400;color:var(--ink-soft);">— shown as column headers on the bracket, left side and right side can differ (e.g. different dates)</span></label>
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:8px;">
        <div style="flex:1;min-width:220px;">
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Left side</div>
          ${defaults.left.map((d,i)=>`<input type="text" class="round-label-left" data-i="${i}" placeholder="${escapeHtml(d)}" value="${escapeHtml((rl.left&&rl.left[i])||'')}" style="margin-bottom:6px;">`).join('')}
        </div>
        <div style="flex:1;min-width:220px;">
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Right side</div>
          ${defaults.right.map((d,i)=>`<input type="text" class="round-label-right" data-i="${i}" placeholder="${escapeHtml(d)}" value="${escapeHtml((rl.right&&rl.right[i])||'')}" style="margin-bottom:6px;">`).join('')}
        </div>
      </div>
      <div style="margin-top:8px;max-width:260px;">
        <label for="round-label-final" style="font-size:12px;color:var(--ink-soft);">Final</label>
        <input type="text" id="round-label-final" placeholder="Final" value="${escapeHtml(rl.final||'')}">
      </div>
    `;
    section.querySelectorAll('.round-label-left').forEach(el=>{
      el.oninput = ()=>{ if(!state.adminConfig.roundLabels.left) state.adminConfig.roundLabels.left=[]; state.adminConfig.roundLabels.left[+el.dataset.i] = el.value; };
    });
    section.querySelectorAll('.round-label-right').forEach(el=>{
      el.oninput = ()=>{ if(!state.adminConfig.roundLabels.right) state.adminConfig.roundLabels.right=[]; state.adminConfig.roundLabels.right[+el.dataset.i] = el.value; };
    });
    section.querySelector('#round-label-final').oninput = (e)=>{ state.adminConfig.roundLabels.final = e.target.value; };
  }

  drawBearRows();

  document.getElementById('add-bear-btn').onclick = ()=>{
    state.adminConfig.bears.push({name:'',bye:false,image:null});
    drawBearRows();
  };


  document.getElementById('save-config-btn').onclick = async ()=>{
    const statusEl = document.getElementById('config-status');
    state.adminConfig.eventName = document.getElementById('event-name').value.trim() || 'Fat Bear Week Bracket';
    state.adminConfig.votingStartISO = localInputToIso(document.getElementById('voting-start').value) || DEFAULT_VOTING_START;
    statusEl.textContent = 'Saving…';
    await saveConfig(state.adminYear, state.adminConfig);
    if(state.adminYear === state.activeYear) state.config = state.adminConfig;
    statusEl.textContent = 'Saved.';
    statusEl.style.color = 'var(--moss)';
  };

  // results card
  const validBears = state.adminConfig.bears.filter(b=>b.name && b.name.trim());
  if(validBears.length >= 2){
    const entries = buildRound1Entries(validBears);
    const advancerCount = entries.length;
    const isPow2 = advancerCount>0 && (advancerCount & (advancerCount-1))===0;
    if(isPow2){
      state.adminResults = state.adminResults || await loadResults(state.adminYear);
      const resCard = document.createElement('div');
      resCard.className = 'card admin-card admin-results-card';
      resCard.innerHTML = `<h2 class="section-title">Official results — ${escapeHtml(state.adminYear)}</h2>
        <p class="section-sub">Click the actual winner of each matchup as results come in. This is what everyone's bracket gets scored against.</p>`;
      const mount = document.createElement('div');
      resCard.appendChild(mount);
      const saveRow = document.createElement('div');
      saveRow.className = 'admin-save-row';
      saveRow.innerHTML = `<button class="btn btn-primary" id="save-results-btn">Save results</button><span id="results-status" style="font-size:13px;color:var(--ink-soft);margin-left:10px;"></span>`;
      resCard.appendChild(saveRow);
      page.appendChild(resCard);

      function drawResults(){
        redrawBracketPreservingScroll(mount, ()=>{
          mount.innerHTML = '';
          renderBracketTree(mount, validBears, state.adminResults.picks, {roundLabels: state.adminConfig.roundLabels}, (matchId, bearName)=>{
            state.adminResults.picks[matchId] = bearName;
            state.adminResults.picks = prunePicks(validBears, state.adminResults.picks);
            drawResults();
          });
        });
      }
      drawResults();

      resCard.querySelector('#save-results-btn').onclick = async ()=>{
        const statusEl = resCard.querySelector('#results-status');
        statusEl.textContent = 'Saving…';
        await saveResults(state.adminYear, state.adminResults);
        statusEl.textContent = 'Saved.';
        statusEl.style.color = 'var(--moss)';
      };
    }
  }

  // submissions list
  const subsCard = document.createElement('div');
  subsCard.className = 'card admin-card admin-submissions-card';
  page.appendChild(subsCard);
  await drawSubmissionsSection(subsCard, validBears);

  const signOutRow = document.createElement('div');
  signOutRow.style.marginTop = '20px';
  signOutRow.innerHTML = `<button class="btn btn-ghost" id="signout-btn">Sign out of admin</button>`;
  page.appendChild(signOutRow);
  document.getElementById('signout-btn').onclick = async ()=>{
    if(auth) await auth.signOut();
    state.adminAuthed = false;
    state.adminUser = null;
    renderAdmin();
  };
}

/* ---------- submissions management (admin) ---------- */
async function drawSubmissionsSection(container, validBears){
  const subs = await loadAllSubmissions(state.adminYear);
  container.innerHTML = '';
  const title = document.createElement('h2');
  title.className = 'section-title';
  title.textContent = 'Submissions ('+subs.length+')';
  container.appendChild(title);

  if(state.adminEditingSlug){
    const editingSub = subs.find(s=>slugify(s.name)===state.adminEditingSlug);
    if(editingSub && validBears.length>=2){
      const editPanel = document.createElement('div');
      editPanel.style.cssText = 'margin-bottom:20px;border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--parchment-dim);';
      editPanel.innerHTML = `<p class="section-sub" style="margin-bottom:12px;">Editing <strong>${escapeHtml(editingSub.name)}</strong>'s bracket.</p>`;
      const mount = document.createElement('div');
      editPanel.appendChild(mount);
      const btnRow = document.createElement('div');
      btnRow.style.marginTop='14px';
      btnRow.innerHTML = `<button class="btn btn-primary" id="save-edit-btn">Save changes</button> <button class="btn btn-ghost" id="cancel-edit-btn">Cancel</button> <span id="edit-status" style="font-size:13px;color:var(--ink-soft);margin-left:8px;"></span>`;
      editPanel.appendChild(btnRow);
      container.appendChild(editPanel);

      function drawEditBracket(){
        redrawBracketPreservingScroll(mount, ()=>{
          mount.innerHTML = '';
          renderBracketTree(mount, validBears, state.adminEditingPicks, {roundLabels: state.adminConfig.roundLabels}, (matchId, bearName)=>{
            state.adminEditingPicks[matchId] = bearName;
            state.adminEditingPicks = prunePicks(validBears, state.adminEditingPicks);
            drawEditBracket();
          });
        });
      }
      drawEditBracket();

      editPanel.querySelector('#save-edit-btn').onclick = async ()=>{
        const statusEl = editPanel.querySelector('#edit-status');
        statusEl.textContent = 'Saving…';
        editingSub.picks = state.adminEditingPicks;
        editingSub.updatedAt = new Date().toISOString();
        await sset('submission:'+state.adminYear+':'+state.adminEditingSlug, JSON.stringify(editingSub), true);
        state.adminEditingSlug = null; state.adminEditingName = null; state.adminEditingPicks = null;
        await drawSubmissionsSection(container, validBears);
      };
      editPanel.querySelector('#cancel-edit-btn').onclick = async ()=>{
        state.adminEditingSlug = null; state.adminEditingName = null; state.adminEditingPicks = null;
        await drawSubmissionsSection(container, validBears);
      };
    }
  }

  const table = document.createElement('table');
  table.className = 'leaderboard';
  if(subs.length===0){
    table.innerHTML = `<tbody><tr><td style="color:var(--ink-soft);">No submissions yet.</td></tr></tbody>`;
  } else {
    const canEdit = validBears.length>=2;
    const rowsHtml = subs.map(s=>{
      const slug = slugify(s.name);
      return `<tr>
        <td data-label="Player">${escapeHtml(s.name)}</td>
        <td data-label="Last updated">${fmtDate(s.updatedAt)}</td>
        <td data-label="Actions" class="sub-action-cell">
          ${canEdit ? `<button class="btn btn-ghost sub-edit" data-slug="${slug}" style="padding:6px 10px;">Edit</button>` : ''}
          <button class="btn btn-ghost sub-reset" data-slug="${slug}" style="padding:6px 10px;">Reset</button>
          <button class="btn btn-ghost sub-pin-reset" data-slug="${slug}" style="padding:6px 10px;">Reset PIN</button>
          <button class="btn btn-ghost sub-delete" data-slug="${slug}" style="padding:6px 10px;color:var(--rust);">Delete</button>
        </td>
      </tr>`;
    }).join('');
    table.innerHTML = `<thead><tr><th>Player</th><th>Last updated</th><th>Actions</th></tr></thead><tbody>${rowsHtml}</tbody>`;
  }
  container.appendChild(table);

  container.querySelectorAll('.sub-edit').forEach(btn=>{
    btn.onclick = async ()=>{
      const slug = btn.dataset.slug;
      const sub = subs.find(s=>slugify(s.name)===slug);
      if(!sub) return;
      state.adminEditingSlug = slug;
      state.adminEditingName = sub.name;
      state.adminEditingPicks = Object.assign({}, sub.picks||{});
      await drawSubmissionsSection(container, validBears);
    };
  });

  container.querySelectorAll('.sub-reset').forEach(btn=>{
    armDoubleClick(btn, 'Reset', 'Clear picks?', async ()=>{
      const slug = btn.dataset.slug;
      const sub = subs.find(s=>slugify(s.name)===slug);
      if(!sub) return;
      sub.picks = {};
      sub.updatedAt = new Date().toISOString();
      await sset('submission:'+state.adminYear+':'+slug, JSON.stringify(sub), true);
      await drawSubmissionsSection(container, validBears);
    });
  });

  container.querySelectorAll('.sub-pin-reset').forEach(btn=>{
    armDoubleClick(btn, 'Reset PIN', 'Confirm reset?', async ()=>{
      const slug = btn.dataset.slug;
      const sub = subs.find(s=>slugify(s.name)===slug);
      if(!sub) return;
      delete sub.pinHash;
      await sset('submission:'+state.adminYear+':'+slug, JSON.stringify(sub), true);
      if(state.adminYear===state.activeYear && state.userSlug===slug){
        state.userAccessGranted=false;
        state.userPinHash='';
      }
      await drawSubmissionsSection(container, validBears);
    });
  });

  container.querySelectorAll('.sub-delete').forEach(btn=>{
    armDoubleClick(btn, 'Delete', 'Confirm delete?', async ()=>{
      const slug = btn.dataset.slug;
      await sdelete('submission:'+state.adminYear+':'+slug, true);
      await drawSubmissionsSection(container, validBears);
    });
  });
}

function armDoubleClick(btn, restLabel, armedLabel, onConfirm){
  btn.textContent = restLabel;
  btn.onclick = ()=>{
    if(btn.dataset.armed==='1'){
      btn.dataset.armed = '';
      onConfirm();
    } else {
      btn.dataset.armed = '1';
      btn.textContent = armedLabel;
      setTimeout(()=>{
        if(btn.dataset.armed==='1'){
          btn.dataset.armed = '';
          btn.textContent = restLabel;
        }
      }, 3000);
    }
  };
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Could not load image'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

/* ---------- utils ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isoToLocalInput(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function localInputToIso(val){
  if(!val) return null;
  const d = new Date(val);
  if(isNaN(d.getTime())) return null;
  return d.toISOString();
}

/* ---------- routing ---------- */
const VALID_VIEWS = ['home','leaderboard','admin'];

async function switchView(view, opts){
  opts = opts || {};
  state.view = view;
  if(!opts.skipHash){
    const hashVal = view==='home' ? '' : view;
    history.replaceState(null, '', hashVal ? ('#'+hashVal) : window.location.pathname + window.location.search);
  }
  setNavYear();
  if(view==='home') await renderHome();
  else if(view==='leaderboard') await renderLeaderboard();
  else if(view==='admin') await renderAdmin();
}

document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.onclick = ()=> switchView(tab.dataset.view);
});

window.addEventListener('hashchange', ()=>{
  const v = window.location.hash.replace('#','') || 'home';
  if(VALID_VIEWS.includes(v)) switchView(v, {skipHash:true});
});

/* ---------- init ---------- */
async function checkStorageAvailable(){
  if(FIREBASE_NOT_CONFIGURED || !db){
    return {ok:false, reason:'unconfigured'};
  }
  try{
    await db.collection('kv').doc('active-year').get();
    return {ok:true};
  }catch(e){
    console.error('Fat Bear Week: Firestore check failed', e);
    return {ok:false, reason:'unreachable'};
  }
}

async function init(){
  if(auth){
    await new Promise(resolve=>{
      const unsubscribe = auth.onAuthStateChanged(user=>{
        state.adminUser = user || null;
        state.adminAuthed = isAuthorizedAdmin(user);
        unsubscribe();
        resolve();
      },()=>resolve());
    });
  }
  const check = await checkStorageAvailable();
  state.storageOk = check.ok;
  const warnEl = document.getElementById('storage-warning');
  if(warnEl){
    if(check.ok){
      warnEl.style.display = 'none';
    } else {
      warnEl.style.display = 'block';
      warnEl.textContent = check.reason==='unconfigured'
        ? "This page isn't connected to its database yet. See the comment near the top of the file's <script> for setup steps."
        : "Can't reach the database right now. Check your Firestore security rules and internet connection, then refresh.";
    }
  }
  state.activeYear = await loadActiveYear();
  state.config = await loadConfig(state.activeYear);
  setNavYear();
  const initialView = window.location.hash.replace('#','');
  const view = VALID_VIEWS.includes(initialView) ? initialView : 'home';
  await switchView(view, {skipHash:true});
}
init();
